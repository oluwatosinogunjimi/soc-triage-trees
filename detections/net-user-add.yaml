id: net-user-add
title: User Account Creation via Command Line
tactic: Persistence
technique: 'Create Account: Local Account'
technique_ids:
- T1136.001
severity: Medium
severity_why: New local accounts are rarely created by hand on managed estates; it merits review but usually needs a second signal to confirm malice.
goal: Catch a local user account being created from the command line, often a backdoor account for persistence.
description: Detects creation of local user accounts using command-line utilities. This behavior is commonly associated with persistence or unauthorized access.
strategy: '`DeviceProcessEvents` where the command line matches `net user <name> ... /add`.'
technical_context: Attackers create an account with `net user <name> <password> /add`, then usually add it to Administrators or Remote Desktop Users. Account names are often chosen to look like service or support accounts. The parent process and the same session's next commands show intent.
blind_spots:
- The pattern requires text between `net user` and `/add`, so `net user /add <name>` (switch before the name) is not matched.
- net1.exe is not matched (the companion admin-group rule does match it).
- 'Other creation methods: PowerShell `New-LocalUser`, WMI, direct API calls and attack tools.'
- Domain accounts created with `/domain` are matched, but accounts created on a domain controller through AD tools are not.
- The `DeviceEvents` ActionType `UserAccountCreated` records the creation itself whatever tool made it, and would close most of these gaps.
false_positives:
- Provisioning and imaging scripts that create local accounts.
- Kiosk, lab and shared-device setup.
frequency: Scheduled
lookback: 1 day
kql: |
  DeviceProcessEvents
  | where ActionType == "ProcessCreated"
  | where ProcessCommandLine matches regex @"(?i)net(\.exe)?\s+user\s+.*\s+/add"
  | project
      DeviceId,
      Timestamp,
      ReportId,
      DeviceName,
      AccountName,
      InitiatingProcessFileName,
      FileName,
      ProcessCommandLine
  | order by Timestamp desc
alert:
  title: User account created via command line on {{DeviceName}}
  description: '{{AccountName}} executed {{FileName}} to create a user on {{DeviceName}}'
  custom_details:
  - 'CommandLine: ProcessCommandLine'
  - 'ParentProcess: InitiatingProcessFileName'
entity_mapping:
  Account: AccountName
  Host: DeviceName
  File: FileName
  Process: ProcessCommandLine
validation:
- date: —
  method: Atomic Red Team
  environment: Windows test device, Defender XDR
  result: Custom rule fired
playbooks:
- local-admin-added
actions:
- Confirm whether the account creation was part of an approved administrative action.
- Investigate command history and parent process behavior for potential compromise.
- Disable unauthorized accounts and perform credential hygiene.
tuning:
- date: '2026-03-25'
  change: Initial version
  reason: Baseline
source: https://github.com/oluwatosinogunjimi/KQL-Query/blob/main/detections/privilege-escalation/net-user-add.md
