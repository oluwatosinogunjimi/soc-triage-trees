<title>Triage Trees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: investigation console. Library home, then a three-panel workspace:
   route line (what you did) | step (what to do now) | case file (what you will hand over). */
:root {
  --bg: #f5f1e8; --surface: #fffdf8; --surface-2: #efe9dc; --surface-3: #e7e0d1; --chrome: #f5f1e8; --hero: #f5f1e8; --hero-dot: transparent;
  --ink: #1f1c17; --ink-2: #4a4337; --muted: #6b6254; --faint: #8c8272;
  --line: #e2dacb; --line-strong: #d6ccb9; --rule: #1f1c17;
  --accent: #1e5a52; --accent-ink: #ffffff; --accent-soft: #dcebe7;
  --primary: #1f1c17; --on-primary: #f5f1e8;
  --code-bg: #1f1c17; --code-ink: #f5f1e8; --code-muted: #b9ae99; --code-accent: #8fd9cc; --code-warn: #f2b84b; --code-line: #3a342b;
  --edge: #b9ae99; --tree-branch: #8c8272;
  --progress-current: #d9a441; --progress-ahead: #e2dacb;
  --fp: #5b6776;  --fp-soft: #e6e9ee;  --fp-block: #5b6776;  --fp-edge: #5b6776;
  --btp: #2e7d4f; --btp-soft: #e1f0e6; --btp-block: #2e7d4f; --btp-edge: #2e7d4f;
  --tp: #b3261e;  --tp-soft: #f8e3df;  --tp-block: #b3261e;  --tp-edge: #b3261e; --tp-on-soft: #7a1d17;
  --inc: #a5620a; --inc-soft: #fbecd3; --inc-block: #a5620a; --inc-edge: #a5620a;
  --on-block: #ffffff; --yes-fill: #b3261e; --no-fill: #2e7d4f;
  --cat-email: #1f1c17; --cat-identity: #1f1c17; --cat-endpoint: #1f1c17; --cat-network: #1f1c17; --cat-cloud: #1f1c17; --cat-triage: #1e5a52;
  --shadow: 0 1px 0 #e2dacb, 0 8px 24px rgba(60, 50, 30, .06);
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f16; --surface: #111925; --surface-2: #0f1620; --surface-3: #172131; --chrome: #0c121b; --hero: #0c131d; --hero-dot: #18222f;
    --ink: #e7edf4; --ink-2: #b4c1d1; --muted: #93a3b8; --faint: #6f7f95;
    --line: #1f2a3a; --line-strong: #2c3b51; --rule: #3a4a60;
    --accent: #4fd1c5; --accent-ink: #06201d; --accent-soft: #10302f;
    --primary: #4fd1c5; --on-primary: #06201d;
    --code-bg: #0b1119; --code-ink: #e7edf4; --code-muted: #93a3b8; --code-accent: #4fd1c5; --code-warn: #f2b84b; --code-line: #1f2a3a;
    --edge: #3d4856; --tree-branch: #2a3b52;
    --progress-current: #f2b84b; --progress-ahead: #223044;
    --fp: #9aaec6;  --fp-soft: #1a2330;  --fp-block: #1a2330;  --fp-edge: #3a4a60;
    --btp: #5bd69a; --btp-soft: #154a34; --btp-block: #0f2a20; --btp-edge: #1f6f4e;
    --tp: #ff7a70;  --tp-soft: #2a1517;  --tp-block: #2a1517;  --tp-edge: #7a2f2c; --tp-on-soft: #ffb4ae;
    --inc: #f2b84b; --inc-soft: #30260f; --inc-block: #30260f; --inc-edge: #6b5314;
    --on-block: #e7edf4; --yes-fill: #c4423b; --no-fill: #1f6f4e;
    --cat-email: #9db4ff; --cat-identity: #c4a5ff; --cat-endpoint: #ffb38a; --cat-network: #7fd8f5; --cat-cloud: #f5d77a; --cat-triage: #4fd1c5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f16; --surface: #111925; --surface-2: #0f1620; --surface-3: #172131; --chrome: #0c121b; --hero: #0c131d; --hero-dot: #18222f;
  --ink: #e7edf4; --ink-2: #b4c1d1; --muted: #93a3b8; --faint: #6f7f95;
  --line: #1f2a3a; --line-strong: #2c3b51; --rule: #3a4a60;
  --accent: #4fd1c5; --accent-ink: #06201d; --accent-soft: #10302f;
  --primary: #4fd1c5; --on-primary: #06201d;
  --code-bg: #0b1119; --code-ink: #e7edf4; --code-muted: #93a3b8; --code-accent: #4fd1c5; --code-warn: #f2b84b; --code-line: #1f2a3a;
  --edge: #3d4856; --tree-branch: #2a3b52;
  --progress-current: #f2b84b; --progress-ahead: #223044;
  --fp: #9aaec6;  --fp-soft: #1a2330;  --fp-block: #1a2330;  --fp-edge: #3a4a60;
  --btp: #5bd69a; --btp-soft: #154a34; --btp-block: #0f2a20; --btp-edge: #1f6f4e;
  --tp: #ff7a70;  --tp-soft: #2a1517;  --tp-block: #2a1517;  --tp-edge: #7a2f2c; --tp-on-soft: #ffb4ae;
  --inc: #f2b84b; --inc-soft: #30260f; --inc-block: #30260f; --inc-edge: #6b5314;
  --on-block: #e7edf4; --yes-fill: #c4423b; --no-fill: #1f6f4e;
  --cat-email: #9db4ff; --cat-identity: #c4a5ff; --cat-endpoint: #ffb38a; --cat-network: #7fd8f5; --cat-cloud: #f5d77a; --cat-triage: #4fd1c5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::placeholder { color: var(--muted); opacity: .65; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
code, pre, kbd, .mono { font-family: var(--font-mono); }
kbd { font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--surface); color: var(--muted); line-height: 1.4; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; flex: none; }
.brand:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.brand-mark { width: 22px; height: 22px; flex: none; color: var(--accent); }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .c-cat { white-space: nowrap; }
@media (max-width: 700px) { .crumbs .c-cat, .crumbs .c-sep1 { display: none; } }
.bar .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface);
  padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .75; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
@media (max-width: 600px) { .bar .btn .lbl { display: none; } }

/* ---------- navigation ---------- */
.primary-nav { display: flex; align-items: center; gap: 2px; margin-left: 6px; }
.nav-link { all: unset; box-sizing: border-box; cursor: pointer; padding: 6px 10px; border-radius: var(--r); font-size: 14px; font-weight: 500;
  color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; min-height: 34px; }
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav-link svg { width: 14px; height: 14px; }
details.browse { position: relative; }
details.browse > summary { list-style: none; }
details.browse > summary::-webkit-details-marker { display: none; }
details.browse[open] > summary { background: var(--surface-2); color: var(--ink); }
.browse-menu { position: absolute; top: calc(100% + 8px); left: 0; width: 300px; padding: 6px; display: grid; gap: 1px; z-index: 40; box-shadow: var(--shadow); }
.browse-menu button, .menu-sheet button, .menu-sheet a { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  gap: 16px; padding: 9px 10px; border-radius: 6px; font-size: 14px; }
.browse-menu button:hover, .browse-menu button:focus-visible, .menu-sheet button:hover, .menu-sheet a:hover,
.menu-sheet button:focus-visible, .menu-sheet a:focus-visible { background: var(--surface-2); }
.browse-menu .count, .menu-sheet .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.search-trigger { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--muted);
  padding: 5px 7px 5px 10px; border-radius: var(--r); cursor: pointer; font-size: 13.5px; min-width: 230px; min-height: 34px; }
.search-trigger:hover { border-color: var(--ink-2); color: var(--ink-2); }
.search-trigger svg { width: 15px; height: 15px; flex: none; }
.search-trigger kbd { margin-left: auto; }
.btn.ext svg { width: 12px; height: 12px; opacity: .7; }
a.btn { text-decoration: none; }
a.btn:not(.primary):not(.ghost) { color: var(--ink-2); }
.menu-sheet svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.menu-btn { display: none !important; }
.menu-sheet { position: fixed; top: 60px; right: 12px; left: 12px; z-index: 60; padding: 8px; display: grid; gap: 1px; box-shadow: var(--shadow);
  max-height: calc(100vh - 80px); overflow: auto; }
.menu-sheet .m-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 10px 10px 4px; font-weight: 600; }
.menu-sheet hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
@media (max-width: 1180px) { .wide-only { display: none !important; } .search-trigger { min-width: 0; } }
@media (max-width: 780px) {
  .primary-nav { display: none; } .menu-btn { display: inline-flex !important; }
  .search-trigger .lbl, .search-trigger kbd { display: none; }
  .search-trigger { padding: 7px; background: transparent; border-color: transparent; }
}
.case-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.case-crumbs button { all: unset; cursor: pointer; color: var(--accent); }
.case-crumbs button:hover { text-decoration: underline; }
.case-crumbs button:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
section[id^="cat-"] { scroll-margin-top: 84px; }
.credit { font-size: 14px !important; }
.credit a, footer.foot a { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.credit a:hover, footer.foot a:hover { color: var(--accent); text-decoration-color: currentColor; }

/* ---------- jump palette ---------- */
.pal-ov { position: fixed; inset: 0; z-index: 90; background: rgba(13, 17, 22, .45); display: grid; justify-items: center; align-items: start; padding: 10vh 16px 16px; }
.pal { width: min(660px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: 72vh; }
.pal-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pal-top svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.pal-top input { all: unset; flex: 1; min-width: 0; font-size: 16px; }
.pal-list { list-style: none; margin: 0; padding: 6px; overflow: auto; position: relative; }
.pal-list li.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.pal-list li.opt[aria-selected="true"] { background: var(--accent-soft); }
.pal-list .pt { font-weight: 600; font-size: 14.5px; }
.pal-list .pc { font-size: 12px; color: var(--muted); align-self: center; white-space: nowrap; }
.pal-list .ps { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-list .pg { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 10px 4px; }
.pal-empty { padding: 18px 14px; color: var(--muted); }
.pal-foot { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- about ---------- */
.about { max-width: 860px; margin: 0 auto; padding-block: 36px 48px; padding-inline: 16px; display: grid; gap: 28px; }
.about h1 { font-size: clamp(34px, 5vw, 48px); }
.about h2 { font-size: 22px; margin-bottom: 8px; }
.about p, .about li { color: var(--ink-2); max-width: 70ch; }
.about ol, .about ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.author { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; padding: 20px; }
.avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.link-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
@media (max-width: 520px) { .author { grid-template-columns: 1fr; } }

/* ---------- library ---------- */
.home { max-width: 1240px; margin: 0 auto; padding-block: 32px 48px; padding-inline: 16px; display: grid; gap: 30px; }
.hero { display: grid; gap: 14px; justify-items: start; }
.hero h1 { font-size: clamp(36px, 5.5vw, 56px); font-weight: 700; letter-spacing: -.01em; }
.hero p { color: var(--muted); max-width: 62ch; font-size: 16px; }
.search-wrap { position: relative; width: min(720px, 100%); }
.search-wrap input {
  width: 100%; font-size: 18px; padding: 14px 52px 14px 46px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--surface); box-shadow: var(--shadow);
}
.search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search-wrap kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; cursor: pointer; color: var(--ink-2); text-decoration: none;
}
button.chip:hover, a.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.mono { font-family: var(--font-mono); font-size: 12px; }
.chip.static { cursor: default; }
.resume {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between;
  padding: 14px 18px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent);
}
.resume b { font-family: var(--font-display); font-size: 18px; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 23px; font-weight: 600; }
.section-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.section-head p { color: var(--muted); font-size: 14px; flex-basis: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card {
  all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
  padding: 14px 14px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card h3 { font-family: var(--font-body); font-size: 15px; font-weight: 600; line-height: 1.3; }
.card .alerts { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { display: grid; gap: 7px; }
.card .stats { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.card .stats span { white-space: nowrap; }
.card.start { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto; align-items: center; gap: 16px; border: 1px dashed var(--accent); padding: 18px 20px; }
.card.start h3 { font-family: var(--font-display); font-size: 20px; }
mark { background: var(--inc-soft); color: inherit; border-radius: 2px; padding: 0 1px; }

/* verdict distribution bar */
.vbar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.vbar i { display: block; height: 100%; transition: flex .3s; }
.vbar.lg { height: 10px; }
.v-bg-true_positive { background: var(--tp); } .v-bg-inconclusive { background: var(--inc); }
.v-bg-benign_positive { background: var(--btp); } .v-bg-false_positive { background: var(--fp); }
.vlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.vlegend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.vlegend .vl-true_positive::before { background: var(--tp); } .vlegend .vl-inconclusive::before { background: var(--inc); }
.vlegend .vl-benign_positive::before { background: var(--btp); } .vlegend .vl-false_positive::before { background: var(--fp); }

/* ---------- workspace ---------- */
.case-head { max-width: 1480px; margin: 0 auto; padding-block: 20px 6px; padding-inline: 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.case-head h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; }
.case-head .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); position: relative; }
.case-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sources > summary { cursor: pointer; list-style: none; text-decoration: underline dotted; }
.sources > summary::-webkit-details-marker { display: none; }
.sources .pop-src { position: absolute; z-index: 15; left: 0; top: 100%; margin-top: 6px; padding: 12px 14px; max-width: min(460px, 90vw); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.ws {
  max-width: 1480px; margin: 0 auto; padding-block: 10px 40px; padding-inline: 16px;
  display: grid; gap: 16px; grid-template-columns: 270px minmax(0, 1fr) 340px; align-items: start;
}
@media (max-width: 1200px) { .ws { grid-template-columns: 240px minmax(0, 1fr); } .file { grid-column: 1 / -1; } }
@media (max-width: 800px) { .ws { grid-template-columns: minmax(0, 1fr); } .route-panel { order: 2; } .file { order: 3; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel-title { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); }
@media (max-width: 1200px) { .file.sticky { position: static; } }
@media (max-width: 800px) { .sticky { position: static; } }

/* route line */
.route-panel { padding: 16px 14px; display: grid; gap: 12px; max-height: calc(100vh - 90px); overflow-y: auto; }
@media (max-width: 800px) { .route-panel { max-height: none; } }
.route { list-style: none; margin: 0; padding: 0; }
.route li { position: relative; padding: 0 0 14px 28px; }
.route li::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: var(--line-strong); }
.route li:last-child::before { display: none; }
.route li.done::before { background: var(--accent); }
.route .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); }
.route li.done .dot { border-color: var(--accent); background: var(--accent); }
.route li.done .dot::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.route li.jump .dot { background: var(--accent-soft); }
.route li.jump .dot::after { display: none; }
.route li.now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.route li.ahead .dot { border-style: dashed; }
.route li.ahead { color: var(--muted); }
.route li.end .dot { border-radius: 4px; border-width: 3px; }
.route button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 4px; width: 100%; border-radius: 4px; }
.route button:hover .rq { color: var(--accent); }
.route button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rq { font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.route li.now .rq { font-weight: 600; }
.ans { justify-self: start; font-family: var(--font-mono); font-size: 11.5px; padding: 0 6px; border-radius: 3px; font-weight: 500; }
.ans-yes { background: var(--btp-soft); color: var(--btp); } .ans-no { background: var(--tp-soft); color: var(--tp); }
.ans-unknown { background: var(--inc-soft); color: var(--inc); } .ans-other { background: var(--accent-soft); color: var(--accent); }
.also-snip { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.also-snip.flag { color: var(--tp); font-weight: 600; }
.also-snip.flag::before, .mm-also.flag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tp); display: inline-block; }
.mm-also { grid-column: 1 / -1; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); }
.mm-also.flag { color: var(--tp); font-weight: 600; }
.ev-snip { font-size: 12px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.ahead-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-left: 28px; }

/* stage */
.stage { display: grid; gap: 16px; min-width: 0; }
.stage [tabindex="-1"]:focus { outline: none; }
.step { padding: 24px 26px; display: grid; gap: 16px; }
@media (max-width: 600px) { .step, .brief, .out-body, .note-panel { padding: 18px 16px !important; } }
.kind { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kind .tag { padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.q-text { font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 29px); font-weight: 600; line-height: 1.22; max-width: 44ch; }
.why { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 12px; color: var(--ink-2); max-width: 72ch; }
.why::before { content: ""; background: var(--accent); border-radius: 2px; }
.lookfor { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; max-width: 72ch; }
.lookfor label, .actions-list label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; }
.lookfor input, .actions-list input { margin-top: 4px; accent-color: var(--accent); }
.lookfor input:checked + span, .actions-list input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.also-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.also-head .muted { font-size: 12.5px; }
.also { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; max-width: 80ch; }
.also li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 8px 8px 12px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.also li.a-yes { border-color: var(--tp); background: var(--tp-soft); }
.also li.a-no .aq { color: var(--muted); }
.also .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.also .seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border: 0; background: var(--surface); color: var(--ink-2); cursor: pointer; min-width: 44px; min-height: 30px; }
.also .seg button + button { border-left: 1px solid var(--line-strong); }
.also .seg button[aria-pressed="true"].sy { background: var(--tp); color: #fff; }
.also .seg button[aria-pressed="true"].sn { background: var(--btp); color: #fff; }
.also .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.also-flag { font-size: 13px; padding: 8px 12px; border-radius: var(--r); background: var(--tp-soft); color: var(--tp); max-width: 80ch; }
@media (max-width: 560px) { .also li { grid-template-columns: 1fr; } .also .seg { justify-self: start; } }
.sub { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

details.kql { border: 1px solid var(--line); border-radius: var(--r); background: var(--code-bg); min-width: 0; }
details.kql > summary { cursor: pointer; padding: 9px 12px; display: flex; gap: 10px; align-items: center; list-style: none; flex-wrap: wrap; }
details.kql > summary::-webkit-details-marker { display: none; }
details.kql > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
details.kql[open] > summary::before { transform: rotate(90deg); }
.plat { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.kql-title { flex: 1; min-width: 0; font-weight: 500; font-size: 14px; }
pre.code { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; border-top: 1px solid var(--line); white-space: pre; }
.ph-empty { color: var(--inc); font-weight: 500; }
.ph-set { color: var(--accent); }

.evidence { display: grid; gap: 6px; }
.evidence label { font-weight: 600; font-size: 14px; }
.evidence .hint { font-size: 12px; color: var(--muted); }
textarea, input.field { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface-2); padding: 9px 11px; min-width: 0; }
textarea:focus, input.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
textarea { resize: vertical; min-height: 60px; }

.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ans-btn {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 16px;
  transition: border-color .12s, background .12s, transform .08s;
}
.ans-btn:active { transform: translateY(1px); }
.ans-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ans-btn.y:hover { border-color: var(--btp); background: var(--btp-soft); color: var(--btp); }
.ans-btn.n:hover { border-color: var(--tp); background: var(--tp-soft); color: var(--tp); }
.ans-btn.u:hover { border-color: var(--inc); background: var(--inc-soft); color: var(--inc); }
.ans-btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ans-btn.go:hover { filter: brightness(1.07); }
.ans-btn.go kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .75; }
.options { display: grid; gap: 8px; }
.options .ans-btn { font-size: 15px; font-weight: 500; justify-content: flex-start; }
.options .ans-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.back-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.endings { padding: 16px 18px; display: grid; gap: 10px; }
.endings-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.endings-list { display: flex; flex-wrap: wrap; gap: 6px; }
.end-pill { font-size: 12.5px; padding: 3px 9px; border-radius: 4px; transition: opacity .2s; }
.ep-true_positive { background: var(--tp-soft); color: var(--tp); } .ep-inconclusive { background: var(--inc-soft); color: var(--inc); }
.ep-benign_positive { background: var(--btp-soft); color: var(--btp); } .ep-false_positive { background: var(--fp-soft); color: var(--fp); }
.ep-gone { opacity: .35; text-decoration: line-through; }

/* briefing */
.brief { padding: 26px; display: grid; gap: 22px; }
.brief h2 { font-size: 28px; font-weight: 700; }
.brief .lead { color: var(--ink-2); max-width: 68ch; font-size: 16px; }
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 26px; }
@media (max-width: 900px) { .brief-grid { grid-template-columns: minmax(0, 1fr); } }
.stages { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; display: grid; }
.stages li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.stages li:first-child { border-top: 0; }
.stages li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.stages .alt { display: grid; gap: 3px; }
.stages .alt span + span::before { content: "or "; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.start-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

/* outcome */
.verdict-banner { border-radius: 12px; padding: 22px 24px; display: grid; gap: 10px; border: 1px solid transparent; border-left-width: 6px; }
.vb-true_positive { background: var(--tp-soft); border-color: var(--tp); }
.vb-inconclusive { background: var(--inc-soft); border-color: var(--inc); }
.vb-benign_positive { background: var(--btp-soft); border-color: var(--btp); }
.vb-false_positive { background: var(--fp-soft); border-color: var(--fp); }
.verdict-label { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vb-true_positive .verdict-label { color: var(--tp); } .vb-inconclusive .verdict-label { color: var(--inc); }
.vb-benign_positive .verdict-label { color: var(--btp); } .vb-false_positive .verdict-label { color: var(--fp); }
.esc { padding: 1px 8px; border-radius: 3px; background: var(--tp); color: var(--surface); }
.verdict-banner h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; }
.verdict-banner p { max-width: 70ch; font-size: 16px; }
.out-body { padding: 22px 24px; display: grid; gap: 18px; }
.out-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
@media (max-width: 900px) { .out-grid { grid-template-columns: minmax(0, 1fr); } }
.actions-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 7px; }
.out-block p { margin-top: 6px; max-width: 70ch; }

/* note editor */
.note-panel { padding: 22px 24px; display: grid; gap: 12px; }
.note-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.note-controls label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.toggles { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--accent); }
.note-out { font-family: var(--font-body); font-size: 14px; line-height: 1.6; min-height: 340px; background: var(--surface); }
.warn { font-size: 13px; padding: 8px 12px; border-radius: var(--r); background: var(--inc-soft); color: var(--inc); }

/* case file */
.file { display: grid; gap: 16px; }
.file .panel { padding: 16px; display: grid; gap: 12px; }
.ent { display: grid; gap: 4px; }
.ent label { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.ent label code { font-size: 11px; }
.ent input { font-family: var(--font-mono); font-size: 13px; padding: 7px 9px; }
.ent.missing input { border-style: dashed; }
.ent-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.draft { font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; color: var(--ink-2); max-height: 300px; overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0; font-family: var(--font-body); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }

/* map overlay */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ov-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.ov-bar h2 { font-size: 18px; margin-right: 6px; }
.ov-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
@media (max-width: 900px) { .ov-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; } }
.viewport { position: relative; overflow: hidden; cursor: grab; min-height: 0; background-color: var(--surface-2);
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; touch-action: none; }
.viewport.dragging { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 40px; }
.zoom-read { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
.ov-detail { border-left: 1px solid var(--line); background: var(--surface); padding: 18px; overflow-y: auto; display: grid; gap: 12px; align-content: start; }
@media (max-width: 900px) { .ov-detail { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
.ov-detail .q-text { font-size: 20px; }
@media (max-width: 700px) { .ov-bar .hide-sm { display: none; } }

/* mind map nodes */
.mm-row { display: flex; align-items: center; }
.mm-children { display: flex; flex-direction: column; justify-content: center; position: relative; margin-left: 30px; }
.mm-children::before { content: ""; position: absolute; left: -30px; top: 50%; width: 30px; border-top: 2px solid var(--edge); }
.mm-branch { position: relative; display: flex; align-items: center; padding: 6px 0 6px 24px; }
.mm-branch::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--edge); }
.mm-branch:first-child::before { top: 50%; } .mm-branch:last-child::before { bottom: 50%; } .mm-branch:only-child::before { display: none; }
.mm-branch::after { content: ""; position: absolute; left: 0; top: 50%; width: 24px; border-top: 2px solid var(--edge); }
.mm-took::after { border-top-color: var(--accent); border-top-width: 3px; }
.mm-edge { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-right: 8px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line-strong); color: var(--muted); position: relative; z-index: 1; }
.mm-e-yes { color: var(--btp); } .mm-e-no { color: var(--tp); } .mm-e-unknown { color: var(--inc); } .mm-e-option { color: var(--accent); }
.mm-edge.took { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mm-card {
  all: unset; box-sizing: border-box; cursor: pointer; flex-shrink: 0; width: 240px; display: grid; gap: 3px 8px;
  grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "tag toggle" "label label";
  padding: 9px 11px; background: var(--surface); border: 1px solid var(--line-strong); border-left-width: 4px; border-radius: var(--r);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04); transition: box-shadow .12s;
}
.mm-card:hover { box-shadow: var(--shadow); }
.mm-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mm-tag { grid-area: tag; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mm-label { grid-area: label; font-size: 13px; line-height: 1.35; }
.mm-toggle { grid-area: toggle; font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 5px; align-self: start; }
.mm-question, .mm-choice { border-left-color: var(--accent); }
.mm-check { border-left-color: var(--muted); }
.mm-link { border-style: dashed; border-left-style: solid; border-left-color: var(--accent); }
.mm-v-false_positive { background: var(--fp-soft); border-left-color: var(--fp); }
.mm-v-benign_positive { background: var(--btp-soft); border-left-color: var(--btp); }
.mm-v-true_positive { background: var(--tp-soft); border-left-color: var(--tp); }
.mm-v-inconclusive { background: var(--inc-soft); border-left-color: var(--inc); }
.mm-v-false_positive .mm-tag { color: var(--fp); } .mm-v-benign_positive .mm-tag { color: var(--btp); }
.mm-v-true_positive .mm-tag { color: var(--tp); } .mm-v-inconclusive .mm-tag { color: var(--inc); }
.mm-seen { border-top-color: var(--accent); border-right-color: var(--accent); border-bottom-color: var(--accent); }
.mm-here { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 5px var(--accent); }
.mm-selected { outline: 2px solid var(--ink); outline-offset: 3px; }

/* shortcuts + toast */
.pop { position: fixed; right: 16px; top: 62px; z-index: 60; width: min(340px, calc(100vw - 32px)); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 0; font-size: 13.5px; align-items: center; }
.pop dt { text-align: right; }
.pop dd { margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 13.5px; }
footer.foot { text-align: center; color: var(--muted); font-size: 12px; padding-block: 0 28px; padding-inline: 16px; }

/* ================= Field Guide (light) / Console (dark) skin ================= */
h1, h2, h3 { font-weight: 500; }
.bar { background: var(--chrome); padding-block: 12px; padding-inline: clamp(16px, 4vw, 64px); gap: 16px; }
.brand { font-weight: 600; font-size: 23px; }
.primary-nav { gap: 6px; margin-left: 14px; }
.nav-link { color: var(--muted); padding: 6px 8px; font-size: 14.5px; font-weight: 400; background: none; }
.nav-link:hover { background: none; color: var(--ink); }
.nav-link[aria-current="page"] { background: none; color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 7px; }
details.browse[open] > summary { background: none; color: var(--ink); }
.search-trigger { border-radius: 999px; background: var(--surface); padding: 6px 10px 6px 12px; }
.btn { border-radius: 999px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.ghost:hover { background: transparent; }
.theme-btn { all: unset; box-sizing: border-box; cursor: pointer; width: 36px; height: 36px; flex: none; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--ink); }
.theme-btn:hover { border-color: var(--ink-2); }
.theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-btn svg { width: 17px; height: 17px; }
.panel { border-radius: var(--r); }
kbd { border-radius: 4px; }

/* home */
.home { max-width: none; padding: 0; gap: 0; }
.hero-band { background-color: var(--hero); background-image: radial-gradient(var(--hero-dot) 1px, transparent 1px); background-size: 22px 22px; border-bottom: 1px solid var(--line); }
.hero { max-width: 1300px; margin: 0 auto; padding-block: clamp(32px, 6vw, 60px) 34px; padding-inline: clamp(16px, 5vw, 64px);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; justify-items: stretch; }
@media (max-width: 960px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero-art { display: none !important; } }
.hero-text { display: grid; gap: 20px; justify-items: start; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

    const vp = h("div", { class: "viewport", tabindex: "0", "aria-label": "Decision tree. Drag to pan, scroll to move, Ctrl and scroll to zoom." }, h("div", { class: "canvas" }));
    const ov = h("div", { class: "overlay", id: "map-ov", role: "dialog", "aria-modal": "true", "aria-label": "Map of " + t.title },
      h("div", { class: "ov-bar" }, h("h2", {}, t.title), h("span", { class: "muted hide-sm" }, "Click a step to open or fold its branches"),
        h("span", { style: "flex:1" }),
        h("button", { class: "btn sm", type: "button", onclick: () => { mm.open = new Set(all); drawMap({ fit: true }); } }, "Expand all"),
        h("button", { class: "btn sm", type: "button", onclick: () => { mm.open = new Set([t.start]); mm.selected = t.start; mm.scale = 1; mm.x = 0; mm.y = 0; drawMap({ focus: true }); } }, "Collapse"),
        h("button", { class: "btn sm", type: "button", onclick: () => { mm.open = new Set([t.start]); mmRevealPath(t); drawMap({ focus: true }); } }, "My path"),
        h("button", { class: "btn sm", type: "button", "aria-label": "Zoom out", onclick: () => zoomAt(1 / 1.2) }, icon("minus")),
        h("span", { class: "zoom-read" }, "100%"),
        h("button", { class: "btn sm", type: "button", "aria-label": "Zoom in", onclick: () => zoomAt(1.2) }, icon("plus")),
        h("button", { class: "btn sm", type: "button", "aria-label": "Fit to screen", onclick: fitMap }, icon("fit")),
        h("button", { class: "btn sm primary", type: "button", onclick: closeMap }, icon("close"), "Close", h("kbd", {}, "Esc"))),
      h("div", { class: "ov-body" }, vp, h("aside", { class: "ov-detail" })));
    document.body.append(ov); document.body.style.overflow = "hidden";
    let drag = null;
    vp.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, ox: mm.x, oy: mm.y, moved: false, id: e.pointerId }; });
    vp.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; vp.classList.add("dragging"); try { vp.setPointerCapture(drag.id); } catch (x) {} }
      if (drag.moved) { mm.x = drag.ox + dx; mm.y = drag.oy + dy; applyTransform(); }
    });
    const end = () => { if (drag && drag.moved) { mm.dragged = true; setTimeout(() => { mm.dragged = false; }, 0); } drag = null; vp.classList.remove("dragging"); };
    vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
    vp.addEventListener("wheel", (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
      else { mm.x -= e.deltaX; mm.y -= e.deltaY; applyTransform(); }
    }, { passive: false });
    mm.scale = 1; mm.x = 0; mm.y = 0;
    drawMap();
    requestAnimationFrame(() => focusEl(ov.querySelector(".mm-selected") || ov.querySelector(".mm-card"), S.path.length ? 0.45 : 0.2));
    ov.querySelector(".btn.primary").focus();
  }
  function closeMap() { const ov = document.getElementById("map-ov"); if (ov) ov.remove(); document.body.style.overflow = ""; }

  // ================= keyboard =================
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    const typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette(); return; }
    if (document.getElementById("pal")) { if (e.key === "Escape") closePalette(); return; }
    if (e.key === "Escape") {
      if (document.getElementById("menu-sheet") || document.querySelector("details.browse[open]")) { closeOverlays(); return; }
      if (document.getElementById("map-ov")) { closeMap(); return; }
      if (!document.getElementById("shortcuts").hidden) { document.getElementById("shortcuts").hidden = true; return; }
      if (typing) e.target.blur();
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "?") { toggleShortcuts(); e.preventDefault(); return; }
    if (e.key === "/") {
      e.preventDefault();
      if (S.view !== "home") { openPalette(); return; }
      const i = document.getElementById("home-search"); if (i) i.focus();
      return;
    }
    if (S.view !== "case") return;
    if (e.key === "m" || e.key === "M") { if (document.getElementById("map-ov")) closeMap(); else openMap(); return; }
    if (document.getElementById("map-ov")) return;
    const n = node(S.tree, S.node);
    if (e.key === "Enter") {
      if (tag === "BUTTON" || tag === "A" || tag === "SUMMARY") return;
      const panel = document.querySelector(".stage .brief, .stage .step");
      if (panel && panel._enter) { e.preventDefault(); panel._enter(); }
      return;
    }
    if (!(S.started || S.path.length)) return;
    if ((e.key === "b" || e.key === "B" || e.key === "Backspace") && S.path.length) { e.preventDefault(); rewind(S.path.length - 1); return; }
    if (n.type === "question") {
      if (e.key === "y" || e.key === "Y") answer("yes", n.yes);
      else if (e.key === "n" || e.key === "N") answer("no", n.no);
      else if ((e.key === "u" || e.key === "U") && n.unknown) answer("unknown", n.unknown);
    } else if (n.type === "choice" && /^[1-9]$/.test(e.key)) {
      const o = n.options[Number(e.key) - 1]; if (o) answer("option", o.next, o.label);
    }
  });
  document.addEventListener("click", (e) => {
    const p = document.getElementById("shortcuts");
    if (!p.hidden && !p.contains(e.target) && !(e.target.closest && e.target.closest('[aria-label="Keyboard shortcuts"]'))) p.hidden = true;
    document.querySelectorAll("details.sources[open], details.browse[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
    const ms = document.getElementById("menu-sheet");
    if (ms && !ms.contains(e.target) && !(e.target.closest && e.target.closest(".menu-btn"))) closeOverlays();
  });

  // ================= about =================
  function renderAbout() {
    const app = document.getElementById("app"); app.replaceChildren();
    const ext = (href, label, primary) => h("a", { class: "btn" + (primary ? " primary" : ""), href, target: "_blank", rel: "noopener" }, label, icon("ext"));
    const nQ = bundle.trees.reduce((a, t) => a + Object.values(t.nodes).filter(n => n.type === "question").length, 0);
    const nAlso = bundle.trees.reduce((a, t) => a + Object.values(t.nodes).reduce((b, n) => b + (n.also_check || []).length, 0), 0);
    app.append(h("main", { class: "about" },
      h("section", { style: "display:grid;gap:12px" }, h("h1", {}, "About Triage Trees"),
        h("p", { style: "font-size:17px" }, "Question-driven investigation playbooks for SOC analysts. Pick the alert, answer yes or no questions backed by ready-to-run KQL, reach a verdict with recommended actions, and copy a closure note written from the path you took.")),
      h("section", { class: "panel author" }, h("div", { class: "avatar", "aria-hidden": "true" }, "OO"),
        h("div", {}, h("h2", { style: "margin:0" }, "Oluwatosin Ogunjimi"),
          h("p", {}, "SOC analyst and cybersecurity writer. Triage Trees turns the questions from his article series into playbooks any analyst can walk."),
          h("div", { class: "link-row" }, ext(LINKS.linkedin, "LinkedIn", true), ext(LINKS.medium, "Medium"), ext(LINKS.github, "GitHub")))),
      h("section", {}, h("h2", {}, "Where it came from"),
        h("p", {}, "The project grew out of ", h("a", { href: LINKS.article, target: "_blank", rel: "noopener" }, "Lessons from the SOC: How Analysts Can Triage Smarter, Tune Better, and Stop Drowning in Alerts"),
          ". The article's question bank is now structured data, checked against vendor incident response playbooks and MITRE ATT&CK, with sources listed in every playbook.")),
      h("section", {}, h("h2", {}, "How to use it"),
        h("ol", {},
          h("li", {}, "Find the alert: search the library, press ", h("kbd", {}, IS_MAC ? "\u2318K" : "Ctrl K"), " from anywhere, or start with Universal Triage if nothing fits."),
          h("li", {}, "Fill the case entities once. They go into every query and the note."),
          h("li", {}, "Answer each step. Wider checks under \u201cAlso check\u201d cover related activity; a yes is flagged before a benign close."),
          h("li", {}, "At the verdict, tick the actions, add the ticket reference and copy the closure note."))),
      h("section", {}, h("h2", {}, "What's inside"),
        h("ul", {},
          h("li", {}, bundle.trees.length + " playbooks across email, identity, endpoint, network and cloud."),
          h("li", {}, nQ + " decision questions and " + nAlso + " wider checks."),
          h("li", {}, "KQL for Microsoft Sentinel and Defender XDR at the step it answers. Test queries in your own workspace before relying on them."))),
      h("section", {}, h("h2", {}, "Privacy"),
        h("p", {}, "Case data stays in your browser's local storage and is never sent anywhere. Don't enter data your client's handling rules forbid storing on your workstation.")),
      h("section", {}, h("h2", {}, "Contribute"),
        h("p", {}, "Each playbook is one YAML file, validated in CI. Suggest a new use case or improve a question on GitHub."),
        h("div", { class: "link-row" }, ext(LINKS.github, "Open the repository"), h("button", { class: "btn", type: "button", onclick: goHome }, "Back to the library")))));
  }

  // ================= render =================
  function render() {
    renderBar();
    if (S.view === "home") renderHome(); else if (S.view === "about") renderAbout(); else renderCase(false);
  }
  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1);
    if (id === "library") { if (S.view !== "home") goHome(); return; }
    if (id === "about") { if (S.view !== "about") openAbout(); return; }
    if (TREES[id] && id !== S.tree) openTree(id);
  });
  render();
})();
</script>
