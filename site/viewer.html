<title>Triage Trees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: investigation console. Library home, then a three-panel workspace:
   route line (what you did) | step (what to do now) | case file (what you will hand over). */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --surface-3: #e9ecf1;
  --ink: #111821;
  --ink-2: #2b3440;
  --muted: #5d6776;
  --line: #d9dee5;
  --line-strong: #bfc6d0;
  --accent: #2447d8;
  --accent-ink: #ffffff;
  --accent-soft: #e5eafc;
  --code-bg: #f3f5f8;
  --edge: #b3bcc8;
  --fp: #56677e;   --fp-soft: #e6eaf0;
  --btp: #15784a;  --btp-soft: #dff1e7;
  --tp: #c0262d;   --tp-soft: #fbe3e2;
  --inc: #9a5a00;  --inc-soft: #fcefd6;
  --shadow: 0 1px 2px rgba(17, 24, 33, .06), 0 4px 16px rgba(17, 24, 33, .05);
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #141920; --surface-2: #1a2029; --surface-3: #212833; --ink: #e8ecf1; --ink-2: #c9d0da;
    --muted: #93a0b0; --line: #262e39; --line-strong: #36404d; --accent: #7f9cff; --accent-ink: #0d1116; --accent-soft: #1c2647;
    --code-bg: #10151b; --edge: #3d4856;
    --fp: #a4b3c7; --fp-soft: #232b36; --btp: #5ccf92; --btp-soft: #15291f; --tp: #ff8a84; --tp-soft: #331b1c; --inc: #f1b84f; --inc-soft: #30260f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #141920; --surface-2: #1a2029; --surface-3: #212833; --ink: #e8ecf1; --ink-2: #c9d0da;
  --muted: #93a0b0; --line: #262e39; --line-strong: #36404d; --accent: #7f9cff; --accent-ink: #0d1116; --accent-soft: #1c2647;
  --code-bg: #10151b; --edge: #3d4856;
  --fp: #a4b3c7; --fp-soft: #232b36; --btp: #5ccf92; --btp-soft: #15291f; --tp: #ff8a84; --tp-soft: #331b1c; --inc: #f1b84f; --inc-soft: #30260f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::placeholder { color: var(--muted); opacity: .65; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
code, pre, kbd, .mono { font-family: var(--font-mono); }
kbd { font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--surface); color: var(--muted); line-height: 1.4; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; flex: none; }
.brand:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.brand-mark { width: 22px; height: 22px; flex: none; color: var(--accent); }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .c-cat { white-space: nowrap; }
@media (max-width: 700px) { .crumbs .c-cat, .crumbs .c-sep1 { display: none; } }
.bar .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface);
  padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .75; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
@media (max-width: 600px) { .bar .btn .lbl { display: none; } }

/* ---------- library ---------- */
.home { max-width: 1240px; margin: 0 auto; padding-block: 32px 48px; padding-inline: 16px; display: grid; gap: 30px; }
.hero { display: grid; gap: 14px; justify-items: start; }
.hero h1 { font-size: clamp(36px, 5.5vw, 56px); font-weight: 700; letter-spacing: -.01em; }
.hero p { color: var(--muted); max-width: 62ch; font-size: 16px; }
.search-wrap { position: relative; width: min(720px, 100%); }
.search-wrap input {
  width: 100%; font-size: 18px; padding: 14px 52px 14px 46px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--surface); box-shadow: var(--shadow);
}
.search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search-wrap kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; cursor: pointer; color: var(--ink-2); text-decoration: none;
}
button.chip:hover, a.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.mono { font-family: var(--font-mono); font-size: 12px; }
.chip.static { cursor: default; }
.resume {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between;
  padding: 14px 18px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent);
}
.resume b { font-family: var(--font-display); font-size: 18px; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 23px; font-weight: 600; }
.section-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.section-head p { color: var(--muted); font-size: 14px; flex-basis: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card {
  all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
  padding: 14px 14px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card h3 { font-family: var(--font-body); font-size: 15px; font-weight: 600; line-height: 1.3; }
.card .alerts { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { display: grid; gap: 7px; }
.card .stats { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.card .stats span { white-space: nowrap; }
.card.start { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto; align-items: center; gap: 16px; border: 1px dashed var(--accent); padding: 18px 20px; }
.card.start h3 { font-family: var(--font-display); font-size: 20px; }
mark { background: var(--inc-soft); color: inherit; border-radius: 2px; padding: 0 1px; }

/* verdict distribution bar */
.vbar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.vbar i { display: block; height: 100%; transition: flex .3s; }
.vbar.lg { height: 10px; }
.v-bg-true_positive { background: var(--tp); } .v-bg-inconclusive { background: var(--inc); }
.v-bg-benign_positive { background: var(--btp); } .v-bg-false_positive { background: var(--fp); }
.vlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.vlegend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.vlegend .vl-true_positive::before { background: var(--tp); } .vlegend .vl-inconclusive::before { background: var(--inc); }
.vlegend .vl-benign_positive::before { background: var(--btp); } .vlegend .vl-false_positive::before { background: var(--fp); }

/* ---------- workspace ---------- */
.case-head { max-width: 1480px; margin: 0 auto; padding-block: 20px 6px; padding-inline: 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.case-head h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; }
.case-head .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); position: relative; }
.case-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sources > summary { cursor: pointer; list-style: none; text-decoration: underline dotted; }
.sources > summary::-webkit-details-marker { display: none; }
.sources .pop-src { position: absolute; z-index: 15; left: 0; top: 100%; margin-top: 6px; padding: 12px 14px; max-width: min(460px, 90vw); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.ws {
  max-width: 1480px; margin: 0 auto; padding-block: 10px 40px; padding-inline: 16px;
  display: grid; gap: 16px; grid-template-columns: 270px minmax(0, 1fr) 340px; align-items: start;
}
@media (max-width: 1200px) { .ws { grid-template-columns: 240px minmax(0, 1fr); } .file { grid-column: 1 / -1; } }
@media (max-width: 800px) { .ws { grid-template-columns: minmax(0, 1fr); } .route-panel { order: 2; } .file { order: 3; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel-title { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); }
@media (max-width: 1200px) { .file.sticky { position: static; } }
@media (max-width: 800px) { .sticky { position: static; } }

/* route line */
.route-panel { padding: 16px 14px; display: grid; gap: 12px; max-height: calc(100vh - 90px); overflow-y: auto; }
@media (max-width: 800px) { .route-panel { max-height: none; } }
.route { list-style: none; margin: 0; padding: 0; }
.route li { position: relative; padding: 0 0 14px 28px; }
.route li::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: var(--line-strong); }
.route li:last-child::before { display: none; }
.route li.done::before { background: var(--accent); }
.route .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); }
.route li.done .dot { border-color: var(--accent); background: var(--accent); }
.route li.done .dot::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.route li.jump .dot { background: var(--accent-soft); }
.route li.jump .dot::after { display: none; }
.route li.now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.route li.ahead .dot { border-style: dashed; }
.route li.ahead { color: var(--muted); }
.route li.end .dot { border-radius: 4px; border-width: 3px; }
.route button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 4px; width: 100%; border-radius: 4px; }
.route button:hover .rq { color: var(--accent); }
.route button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rq { font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.route li.now .rq { font-weight: 600; }
.ans { justify-self: start; font-family: var(--font-mono); font-size: 11.5px; padding: 0 6px; border-radius: 3px; font-weight: 500; }
.ans-yes { background: var(--btp-soft); color: var(--btp); } .ans-no { background: var(--tp-soft); color: var(--tp); }
.ans-unknown { background: var(--inc-soft); color: var(--inc); } .ans-other { background: var(--accent-soft); color: var(--accent); }
.ev-snip { font-size: 12px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.ahead-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-left: 28px; }

/* stage */
.stage { display: grid; gap: 16px; min-width: 0; }
.stage [tabindex="-1"]:focus { outline: none; }
.step { padding: 24px 26px; display: grid; gap: 16px; }
@media (max-width: 600px) { .step, .brief, .out-body, .note-panel { padding: 18px 16px !important; } }
.kind { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kind .tag { padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.q-text { font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 29px); font-weight: 600; line-height: 1.22; max-width: 44ch; }
.why { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 12px; color: var(--ink-2); max-width: 72ch; }
.why::before { content: ""; background: var(--accent); border-radius: 2px; }
.lookfor { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; max-width: 72ch; }
.lookfor label, .actions-list label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; }
.lookfor input, .actions-list input { margin-top: 4px; accent-color: var(--accent); }
.lookfor input:checked + span, .actions-list input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.sub { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

details.kql { border: 1px solid var(--line); border-radius: var(--r); background: var(--code-bg); min-width: 0; }
details.kql > summary { cursor: pointer; padding: 9px 12px; display: flex; gap: 10px; align-items: center; list-style: none; flex-wrap: wrap; }
details.kql > summary::-webkit-details-marker { display: none; }
details.kql > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
details.kql[open] > summary::before { transform: rotate(90deg); }
.plat { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.kql-title { flex: 1; min-width: 0; font-weight: 500; font-size: 14px; }
pre.code { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; border-top: 1px solid var(--line); white-space: pre; }
.ph-empty { color: var(--inc); font-weight: 500; }
.ph-set { color: var(--accent); }

.evidence { display: grid; gap: 6px; }
.evidence label { font-weight: 600; font-size: 14px; }
.evidence .hint { font-size: 12px; color: var(--muted); }
textarea, input.field { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface-2); padding: 9px 11px; min-width: 0; }
textarea:focus, input.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
textarea { resize: vertical; min-height: 60px; }

.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ans-btn {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 16px;
  transition: border-color .12s, background .12s, transform .08s;
}
.ans-btn:active { transform: translateY(1px); }
.ans-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ans-btn.y:hover { border-color: var(--btp); background: var(--btp-soft); color: var(--btp); }
.ans-btn.n:hover { border-color: var(--tp); background: var(--tp-soft); color: var(--tp); }
.ans-btn.u:hover { border-color: var(--inc); background: var(--inc-soft); color: var(--inc); }
.ans-btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ans-btn.go:hover { filter: brightness(1.07); }
.ans-btn.go kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .75; }
.options { display: grid; gap: 8px; }
.options .ans-btn { font-size: 15px; font-weight: 500; justify-content: flex-start; }
.options .ans-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.back-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.endings { padding: 16px 18px; display: grid; gap: 10px; }
.endings-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.endings-list { display: flex; flex-wrap: wrap; gap: 6px; }
.end-pill { font-size: 12.5px; padding: 3px 9px; border-radius: 4px; transition: opacity .2s; }
.ep-true_positive { background: var(--tp-soft); color: var(--tp); } .ep-inconclusive { background: var(--inc-soft); color: var(--inc); }
.ep-benign_positive { background: var(--btp-soft); color: var(--btp); } .ep-false_positive { background: var(--fp-soft); color: var(--fp); }
.ep-gone { opacity: .35; text-decoration: line-through; }

/* briefing */
.brief { padding: 26px; display: grid; gap: 22px; }
.brief h2 { font-size: 28px; font-weight: 700; }
.brief .lead { color: var(--ink-2); max-width: 68ch; font-size: 16px; }
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 26px; }
@media (max-width: 900px) { .brief-grid { grid-template-columns: minmax(0, 1fr); } }
.stages { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; display: grid; }
.stages li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.stages li:first-child { border-top: 0; }
.stages li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.stages .alt { display: grid; gap: 3px; }
.stages .alt span + span::before { content: "or "; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.start-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

/* outcome */
.verdict-banner { border-radius: 12px; padding: 22px 24px; display: grid; gap: 10px; border: 1px solid transparent; border-left-width: 6px; }
.vb-true_positive { background: var(--tp-soft); border-color: var(--tp); }
.vb-inconclusive { background: var(--inc-soft); border-color: var(--inc); }
.vb-benign_positive { background: var(--btp-soft); border-color: var(--btp); }
.vb-false_positive { background: var(--fp-soft); border-color: var(--fp); }
.verdict-label { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vb-true_positive .verdict-label { color: var(--tp); } .vb-inconclusive .verdict-label { color: var(--inc); }
.vb-benign_positive .verdict-label { color: var(--btp); } .vb-false_positive .verdict-label { color: var(--fp); }
.esc { padding: 1px 8px; border-radius: 3px; background: var(--tp); color: var(--surface); }
.verdict-banner h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; }
.verdict-banner p { max-width: 70ch; font-size: 16px; }
.out-body { padding: 22px 24px; display: grid; gap: 18px; }

  }

  // ================= navigation =================

  function score(t, words) {

    const incA = h("input", { type: "checkbox", id: "note-actions" }); incA.checked = S.incActions;
    const incS = h("input", { type: "checkbox", id: "note-steps" }); incS.checked = S.incSteps;
    const warn = h("div", { class: "warn", hidden: true });
    const out = h("textarea", { class: "note-out", id: "note-out", spellcheck: "true", "aria-label": "Closure note" });
    const regen = () => {
      const r = buildNote(); out.value = r.text;
      warn.hidden = !r.missing.length;
      warn.textContent = r.missing.length ? "Missing values: " + r.missing.map(labelFor).join(", ") + ". Fill them in the case file so the note carries real values." : "";
    };
    ticket.addEventListener("input", () => { S.ticket = ticket.value; save(); regen(); });
    sign.addEventListener("input", () => { S.signoff = sign.value; save(); regen(); });
    incA.addEventListener("change", () => { S.incActions = incA.checked; save(); regen(); });
    incS.addEventListener("change", () => { S.incSteps = incS.checked; save(); regen(); });
    const panel = h("section", { class: "panel note-panel", id: "note-anchor" },
      h("div", { class: "row between" }, h("h2", { style: "font-size:21px" }, "Closure note"),
        h("button", { class: "btn primary", type: "button", onclick: () => copy(out.value) }, icon("copy"), "Copy note")),
      h("div", { class: "note-controls" }, h("label", { for: "note-ticket" }, "Ticket reference", ticket), h("label", { for: "note-sign" }, "Sign-off", sign)),
      h("div", { class: "toggles" }, h("label", { for: "note-actions" }, incA, "Include recommended actions"), h("label", { for: "note-steps" }, incS, "Include investigative steps")),
      warn, out, h("p", { class: "muted" }, "Edit freely before copying. Changing the fields above regenerates the text."));
    regen();
    regenNote = regen;
    return panel;
  }

  // ---- case file ----
  function entityDefs() {
    const ids = [S.tree, ...S.path.map(p => p.tree).reverse()];
    const seen = new Set(); const out = [];
    ids.forEach(tid => (TREES[tid].entities || []).forEach(e => { if (!seen.has(e.key)) { seen.add(e.key); out.push(e); } }));
    return out;
  }
  function renderFile(n) {
    const file = h("aside", { class: "file sticky", "aria-label": "Case file" });
    const defs = entityDefs();
    const filled = () => defs.filter(e => (S.entities[e.key] || "").trim()).length;
    const counter = h("span", { class: "ent-count" }, filled() + "/" + defs.length);
    const ents = h("section", { class: "panel" }, h("div", { class: "row between" }, h("div", { class: "panel-title" }, "Case entities"), defs.length ? counter : null));
    if (!defs.length) ents.append(h("p", { class: "muted" }, "This playbook has no entities."));
    defs.forEach(e => {
      const id = "ent-" + e.key;
      const inp = h("input", { class: "field", id, type: "text", placeholder: e.example || "", spellcheck: "false", autocomplete: "off" });
      inp.value = S.entities[e.key] || "";
      const row = h("div", { class: "ent" + (inp.value.trim() ? "" : " missing") }, h("label", { for: id }, h("span", {}, e.label), h("code", {}, e.key)), inp);
      inp.addEventListener("input", () => {
        S.entities[e.key] = inp.value; save(); row.classList.toggle("missing", !inp.value.trim()); counter.textContent = filled() + "/" + defs.length;
        clearTimeout(renderFile._t); renderFile._t = setTimeout(() => {
          refreshQueries(); refreshDraft(); if (regenNote && node(S.tree, S.node).type === "outcome") regenNote();
        }, 250);
      });
      ents.append(row);
    });
    if (defs.length) ents.append(h("p", { class: "muted" }, "Values fill the queries and the note. Dashed fields are still empty."));
    file.append(ents);
    if (n.type !== "outcome") {
      const pre = h("pre", { class: "draft", id: "draft" });
      file.append(h("section", { class: "panel", id: "draft-panel" },
        h("div", { class: "row between" }, h("div", { class: "panel-title" }, "Closure note · live draft"),
          h("button", { class: "btn sm", type: "button", onclick: () => copy(buildNote().text) }, icon("copy"), "Copy")), pre,
        h("p", { class: "muted" }, "Builds from your answers and evidence. The full editor opens at the verdict.")));
      pre.textContent = buildNote().text;
    }
    return file;
  }
  function refreshDraft() { const pre = document.getElementById("draft"); if (pre) pre.textContent = buildNote().text; }
  function refreshQueries() {
    const n = node(S.tree, S.node);
    const olds = document.querySelectorAll(".stage details.kql");
    if (!olds.length || !n.kql) return;
    const fresh = renderKql(n.kql);
    olds.forEach((el, i) => { if (fresh[i]) { fresh[i].open = el.open; el.replaceWith(fresh[i]); } });
  }

  // ================= map overlay =================
  const mm = { tree: null, open: new Set(), selected: null, scale: 1, x: 0, y: 0, dragged: false };
  function mmReset(t) { mm.tree = t.id; mm.open = new Set([t.start]); mm.selected = t.start; mmRevealPath(t); }
  function mmRevealPath(t) {
    const steps = S.path.filter(st => st.tree === t.id);
    if (!steps.length) return;
    // Walk from the tree start when the path began there; otherwise from the first step in this tree.
    let k = steps[0].node === t.start ? t.start : null;
    if (!k) return;
    mm.open.add(k);
    steps.forEach(st => {
      const want = st.answer === "option" ? "option:" + st.label : st.answer;
      const e = childrenOf(t.nodes[st.node]).find(c => c.ans === want);
      if (!e) return;
      k = k + "/" + e.ans + ">" + e.to; mm.open.add(k);
    });
    mm.selected = k;
  }
  function mmAllKeys(t, nid, k, out, depth) { out.add(k); if (depth > 40) return; childrenOf(t.nodes[nid]).forEach(c => mmAllKeys(t, c.to, k + "/" + c.ans + ">" + c.to, out, depth + 1)); }
  const nidOf = k => { const i = k.lastIndexOf(">"); return i < 0 ? k : k.slice(i + 1); };
  function pathInTree(tid) {
    const visited = new Set(); const taken = new Set();
    S.path.forEach(st => { if (st.tree !== tid) return; visited.add(st.node); taken.add(st.node + "|" + (st.answer === "option" ? "option:" + st.label : st.answer)); });
    if (S.tree === tid) visited.add(S.node);
    return { visited, taken };
  }
  function mmCard(t, nid, k, info) {
    const n = t.nodes[nid]; const kids = childrenOf(n); const isOpen = mm.open.has(k);
    const cls = ["mm-card", "mm-" + n.type];
    if (n.type === "outcome") cls.push("mm-v-" + n.verdict);
    if (info.visited.has(nid)) cls.push("mm-seen");
    if (S.tree === t.id && S.node === nid) cls.push("mm-here");
    if (mm.selected === k) cls.push("mm-selected");
    const label = n.type === "outcome" ? n.title : n.type === "link" ? "Hands over to " + TREES[n.tree].title : shortText(n.text);
    const tag = n.type === "outcome" ? VLABEL[n.verdict] : KIND[n.type];
    return h("button", { class: cls.join(" "), type: "button", "data-key": k, "aria-expanded": kids.length ? String(isOpen) : null,
      onclick: () => {
        if (mm.dragged) return;
        mm.selected = k;
        if (kids.length) { if (isOpen) [...mm.open].forEach(x => { if (x === k || x.startsWith(k + "/")) mm.open.delete(x); }); else mm.open.add(k); }
        drawMap({ keep: k });
      } },
      h("span", { class: "mm-tag" }, tag), h("span", { class: "mm-label" }, label),
      kids.length ? h("span", { class: "mm-toggle", "aria-hidden": "true" }, isOpen ? "−" : "+" + kids.length) : null);
  }
  function mmBranch(t, nid, k, info, depth) {
    const row = h("div", { class: "mm-row" }, mmCard(t, nid, k, info));
    if (mm.open.has(k) && depth < 40) {
      const col = h("div", { class: "mm-children" });
      childrenOf(t.nodes[nid]).forEach(c => {
        const ck = k + "/" + c.ans + ">" + c.to;
        const took = info.taken.has(nid + "|" + c.ans);
        const lbl = c.label ? h("span", { class: "mm-edge mm-e-" + c.ans.split(":")[0] + (took ? " took" : "") }, c.label.length > 30 ? c.label.slice(0, 28) + "..." : c.label) : null;
        col.append(h("div", { class: "mm-branch" + (took ? " mm-took" : "") }, lbl, mmBranch(t, c.to, ck, info, depth + 1)));
      });
      row.append(col);
    }
    return row;
  }
  function mmDetail(t) {
    const box = h("aside", { class: "ov-detail", "aria-live": "polite" });
    const nid = nidOf(mm.selected || t.start); const n = t.nodes[nid];
    if (n.type === "outcome") {
      box.append(h("section", { class: "verdict-banner vb-" + n.verdict, style: "padding:14px 16px" },
          h("div", { class: "verdict-label" }, VLABEL[n.verdict], n.escalate ? h("span", { class: "esc" }, "Escalate") : null),
          h("h2", { style: "font-size:20px" }, n.title), h("p", { style: "font-size:14px" }, fill(n.anchor))),
        h("div", { class: "sub" }, "Risk"), h("p", {}, fill(n.risk)),
        h("div", { class: "sub" }, "Actions"), h("ol", { style: "margin:0;padding-left:18px;display:grid;gap:4px" }, n.actions.map(a => h("li", {}, fill(a)))));
    } else if (n.type === "link") {
      box.append(h("div", { class: "kind" }, h("span", { class: "tag" }, "Hand-over")), h("div", { class: "q-text" }, n.text), h("p", { class: "muted" }, TREES[n.tree].summary),
        h("button", { class: "btn", type: "button", onclick: () => { closeMap(); openTree(n.tree); } }, "Open " + TREES[n.tree].title));
    } else {
      const outs = reachOutcomes(t.id, nid); const counts = verdictCounts(outs);
      box.append(h("div", { class: "kind" }, h("span", { class: "tag" }, KIND[n.type]), h("span", {}, nid)),
        h("div", { class: "q-text" }, fill(n.text)), n.why ? h("p", { class: "why" }, h("span", {}, fill(n.why))) : null,
        n.look_for ? h("ul", { style: "margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px" }, n.look_for.map(x => h("li", {}, fill(x)))) : null,
        (n.kql && n.kql.length) ? h("p", { class: "muted" }, n.kql.length + " KQL " + (n.kql.length > 1 ? "queries" : "query") + " at this step.") : null,
        h("div", { class: "sub" }, outs.length + " endings reachable from here"), vbar(counts, true), vlegend(counts));
    }
    return box;
  }
  function applyTransform() {
    const c = document.querySelector("#map-ov .canvas"); if (c) c.style.transform = "translate(" + mm.x + "px," + mm.y + "px) scale(" + mm.scale + ")";
    const z = document.querySelector("#map-ov .zoom-read"); if (z) z.textContent = Math.round(mm.scale * 100) + "%";
  }
  function zoomAt(f, cx, cy) {
    const vp = document.querySelector("#map-ov .viewport"); if (!vp) return;
    const r = vp.getBoundingClientRect();
    cx = cx === undefined ? r.width / 2 : cx; cy = cy === undefined ? r.height / 2 : cy;
    const ns = Math.min(2, Math.max(0.2, mm.scale * f));
    mm.x = cx - (cx - mm.x) * (ns / mm.scale); mm.y = cy - (cy - mm.y) * (ns / mm.scale); mm.scale = ns; applyTransform();
  }
  function fitMap() {
    const vp = document.querySelector("#map-ov .viewport"), c = document.querySelector("#map-ov .canvas"); if (!vp || !c) return;
    const w = c.scrollWidth, hh = c.scrollHeight, r = vp.getBoundingClientRect();
    mm.scale = Math.min(1, Math.max(0.2, Math.min(r.width / w, r.height / hh)));
    mm.x = Math.max(0, (r.width - w * mm.scale) / 2); mm.y = Math.max(0, (r.height - hh * mm.scale) / 2); applyTransform();
  }
  function focusEl(el, frac) {
    const vp = document.querySelector("#map-ov .viewport"); if (!vp || !el) return;
    const r = vp.getBoundingClientRect(), e = el.getBoundingClientRect();
    mm.x += (r.left + r.width * (frac || 0.35)) - (e.left + e.width / 2); mm.y += (r.top + r.height / 2) - (e.top + e.height / 2); applyTransform();
  }
  function drawMap(opts) {
    opts = opts || {};
    const ov = document.getElementById("map-ov"); if (!ov) return;
    const t = TREES[S.tree];
    if (mm.tree !== t.id) mmReset(t);
    // Keep the clicked card still on screen while the tree reflows around it.
    let anchor = null;
    if (opts.keep) { const el = ov.querySelector('.mm-card[data-key="' + CSS.escape(opts.keep) + '"]'); if (el) { const b = el.getBoundingClientRect(); anchor = { x: b.left, y: b.top }; } }
    ov.querySelector(".canvas").replaceChildren(mmBranch(t, t.start, t.start, pathInTree(t.id), 0));
    ov.querySelector(".ov-detail").replaceWith(mmDetail(t));
    applyTransform();
    if (anchor) {
      const el = ov.querySelector('.mm-card[data-key="' + CSS.escape(opts.keep) + '"]');
      if (el) { const b = el.getBoundingClientRect(); mm.x += anchor.x - b.left; mm.y += anchor.y - b.top; applyTransform(); }
    } else if (opts.fit) fitMap();
    else if (opts.focus) focusEl(ov.querySelector(".mm-selected"));
  }
  function openMap() {
    if (document.getElementById("map-ov")) return;
    const t = TREES[S.tree];
    mmReset(t);
    const all = new Set(); mmAllKeys(t, t.start, t.start, all, 0);
    const vp = h("div", { class: "viewport", tabindex: "0", "aria-label": "Decision tree. Drag to pan, scroll to move, Ctrl and scroll to zoom." }, h("div", { class: "canvas" }));
    const ov = h("div", { class: "overlay", id: "map-ov", role: "dialog", "aria-modal": "true", "aria-label": "Map of " + t.title },
      h("div", { class: "ov-bar" }, h("h2", {}, t.title), h("span", { class: "muted hide-sm" }, "Click a step to open or fold its branches"),
        h("span", { style: "flex:1" }),
        h("button", { class: "btn sm", type: "button", onclick: () => { mm.open = new Set(all); drawMap({ fit: true }); } }, "Expand all"),
        h("button", { class: "btn sm", type: "button", onclick: () => { mm.open = new Set([t.start]); mm.selected = t.start; mm.scale = 1; mm.x = 0; mm.y = 0; drawMap({ focus: true }); } }, "Collapse"),
        h("button", { class: "btn sm", type: "button", onclick: () => { mm.open = new Set([t.start]); mmRevealPath(t); drawMap({ focus: true }); } }, "My path"),
        h("button", { class: "btn sm", type: "button", "aria-label": "Zoom out", onclick: () => zoomAt(1 / 1.2) }, icon("minus")),
        h("span", { class: "zoom-read" }, "100%"),
        h("button", { class: "btn sm", type: "button", "aria-label": "Zoom in", onclick: () => zoomAt(1.2) }, icon("plus")),
        h("button", { class: "btn sm", type: "button", "aria-label": "Fit to screen", onclick: fitMap }, icon("fit")),
        h("button", { class: "btn sm primary", type: "button", onclick: closeMap }, icon("close"), "Close", h("kbd", {}, "Esc"))),
      h("div", { class: "ov-body" }, vp, h("aside", { class: "ov-detail" })));
    document.body.append(ov); document.body.style.overflow = "hidden";
    let drag = null;
    vp.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, ox: mm.x, oy: mm.y, moved: false, id: e.pointerId }; });
    vp.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; vp.classList.add("dragging"); try { vp.setPointerCapture(drag.id); } catch (x) {} }
      if (drag.moved) { mm.x = drag.ox + dx; mm.y = drag.oy + dy; applyTransform(); }
    });
    const end = () => { if (drag && drag.moved) { mm.dragged = true; setTimeout(() => { mm.dragged = false; }, 0); } drag = null; vp.classList.remove("dragging"); };
    vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
    vp.addEventListener("wheel", (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
      else { mm.x -= e.deltaX; mm.y -= e.deltaY; applyTransform(); }
    }, { passive: false });
    mm.scale = 1; mm.x = 0; mm.y = 0;
    drawMap();
    requestAnimationFrame(() => focusEl(ov.querySelector(".mm-selected") || ov.querySelector(".mm-card"), S.path.length ? 0.45 : 0.2));
    ov.querySelector(".btn.primary").focus();
  }
  function closeMap() { const ov = document.getElementById("map-ov"); if (ov) ov.remove(); document.body.style.overflow = ""; }

  // ================= keyboard =================
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    const typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
    if (e.key === "Escape") {
      if (document.getElementById("map-ov")) { closeMap(); return; }
      if (!document.getElementById("shortcuts").hidden) { document.getElementById("shortcuts").hidden = true; return; }
      if (typing) e.target.blur();
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "?") { toggleShortcuts(); e.preventDefault(); return; }
    if (e.key === "/") {
      e.preventDefault();
      if (S.view !== "home") goHome();
      setTimeout(() => { const i = document.getElementById("home-search"); if (i) i.focus(); }, 0);
      return;
    }
    if (S.view !== "case") return;
    if (e.key === "m" || e.key === "M") { if (document.getElementById("map-ov")) closeMap(); else openMap(); return; }
    if (document.getElementById("map-ov")) return;
    const n = node(S.tree, S.node);
    if (e.key === "Enter") {
      if (tag === "BUTTON" || tag === "A" || tag === "SUMMARY") return;
      const panel = document.querySelector(".stage .brief, .stage .step");
      if (panel && panel._enter) { e.preventDefault(); panel._enter(); }
      return;
    }
    if (!(S.started || S.path.length)) return;
    if ((e.key === "b" || e.key === "B" || e.key === "Backspace") && S.path.length) { e.preventDefault(); rewind(S.path.length - 1); return; }
    if (n.type === "question") {
      if (e.key === "y" || e.key === "Y") answer("yes", n.yes);
      else if (e.key === "n" || e.key === "N") answer("no", n.no);
      else if ((e.key === "u" || e.key === "U") && n.unknown) answer("unknown", n.unknown);
    } else if (n.type === "choice" && /^[1-9]$/.test(e.key)) {
      const o = n.options[Number(e.key) - 1]; if (o) answer("option", o.next, o.label);
    }
  });
  document.addEventListener("click", (e) => {
    const p = document.getElementById("shortcuts");
    if (!p.hidden && !p.contains(e.target) && !(e.target.closest && e.target.closest('[aria-label="Keyboard shortcuts"]'))) p.hidden = true;
    document.querySelectorAll("details.sources[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
  });

  // ================= render =================
  function render() {
    renderBar();
    if (S.view === "home") renderHome(); else renderCase(false);
  }
  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1);
    if (id === "library") { if (S.view !== "home") goHome(); return; }
    if (TREES[id] && id !== S.tree) openTree(id);
  });
  render();
})();
</script>
