<title>Triage Trees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: operator console. Library rail left, one investigation card centre, case file right. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #1a2026;
  --muted: #5a646d;
  --line: #d6dbd4;
  --accent: #1f47c7;
  --accent-soft: #e4e9fb;
  --code-bg: #f2f4f7;
  --fp: #56657a;      --fp-soft: #e8ecf1;
  --btp: #1f7a4d;     --btp-soft: #e2f2e9;
  --tp: #b42323;      --tp-soft: #fbe6e4;
  --inc: #9a6200;     --inc-soft: #fbf0d9;
  --focus: #1f47c7;
  --edge: #aeb6ad;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1a1f25; --surface-2: #20262d; --ink: #e6e9ec; --muted: #9aa4ae;
    --line: #2d353e; --accent: #8aa6ff; --accent-soft: #232d4a; --code-bg: #14181d;
    --fp: #a3b1c4; --fp-soft: #262d37; --btp: #5fcf93; --btp-soft: #1b3127;
    --tp: #ff8a80; --tp-soft: #3a2020; --inc: #f0b64a; --inc-soft: #3a2f17; --focus: #8aa6ff; --edge: #4a5561;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1f25; --surface-2: #20262d; --ink: #e6e9ec; --muted: #9aa4ae;
  --line: #2d353e; --accent: #8aa6ff; --accent-soft: #232d4a; --code-bg: #14181d;
  --fp: #a3b1c4; --fp-soft: #262d37; --btp: #5fcf93; --btp-soft: #1b3127;
  --tp: #ff8a80; --tp-soft: #3a2020; --inc: #f0b64a; --inc-soft: #3a2f17; --focus: #8aa6ff; --edge: #4a5561;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
::placeholder { color: var(--muted); opacity: .6; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
code, pre, .mono { font-family: var(--font-mono); }

.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 12px; padding-inline: 16px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .01em; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }
.topbar .spacer { flex: 1; }

.app {
  display: grid; gap: 16px;
  grid-template-columns: 260px minmax(0, 1fr) 320px;
  padding-block: 16px; padding-inline: 16px;
  max-width: 1500px; margin: 0 auto; align-items: start;
}
@media (max-width: 1150px) { .app { grid-template-columns: 240px minmax(0, 1fr); } .case { grid-column: 1 / -1; } }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } .library { order: 2; } .case { order: 1; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.panel-head h2 { font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.panel-body { padding: 14px; display: grid; gap: 12px; }

/* Library */
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.cat { display: grid; gap: 2px; }
.cat-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 6px 0 2px; }
.tree-btn {
  display: grid; gap: 1px; text-align: left; width: 100%; padding: 7px 9px; border: 0; border-radius: 4px;
  background: transparent; cursor: pointer;
}
.tree-btn:hover { background: var(--surface-2); }
.tree-btn[aria-current="true"] { background: var(--accent-soft); }
.tree-btn .t { font-weight: 500; font-size: 14px; }
.tree-btn .m { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

/* Main */
.main { display: grid; gap: 16px; min-width: 0; }
.tree-head { padding: 16px 18px; display: grid; gap: 8px; }
.tree-head h1 { font-size: 26px; font-weight: 700; }
.tree-head p { margin: 0; color: var(--muted); max-width: 72ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--ink);
  background: var(--surface-2); text-decoration: none;
}
a.chip:hover { border-color: var(--accent); color: var(--accent); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-inline: 12px; overflow-x: auto; }
.tab {
  border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 500; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.view { padding: 18px; display: grid; gap: 16px; min-width: 0; }

.node-kind { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.node-kind .step { color: var(--accent); }
.node-text { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.3; max-width: 60ch; }
.why { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; color: var(--muted); max-width: 72ch; margin: 0; }
.look-for { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 72ch; }

details.kql { border: 1px solid var(--line); border-radius: var(--radius); background: var(--code-bg); min-width: 0; }
details.kql > summary { cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; list-style: none; }
details.kql > summary::-webkit-details-marker { display: none; }
details.kql > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
details.kql[open] > summary::before { transform: rotate(90deg); }
.plat { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.kql-title { font-weight: 500; font-size: 14px; flex: 1; min-width: 0; }
pre.code { margin: 0; padding: 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; border-top: 1px solid var(--line); white-space: pre; }
pre.code .ph-empty { color: var(--inc); font-weight: 500; }
pre.code .ph-set { color: var(--accent); }

.evidence label { font-weight: 500; font-size: 14px; display: block; margin-bottom: 4px; }
.evidence .hint { font-size: 12px; color: var(--muted); }
textarea, input.field {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2);
  padding: 8px 10px; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }

.answers { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: var(--radius);
  cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.yes:hover { border-color: var(--btp); color: var(--btp); }
.btn.no:hover { border-color: var(--tp); color: var(--tp); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.option-list { display: grid; gap: 6px; }
.option-list .btn { text-align: left; }

.verdict {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
}
.v-false_positive { color: var(--fp); background: var(--fp-soft); }
.v-benign_positive { color: var(--btp); background: var(--btp-soft); }
.v-true_positive { color: var(--tp); background: var(--tp-soft); }
.v-inconclusive { color: var(--inc); background: var(--inc-soft); }
.outcome-card { border-left: 4px solid var(--line); padding-left: 14px; display: grid; gap: 10px; }
.outcome-card.v-bar-false_positive { border-color: var(--fp); }
.outcome-card.v-bar-benign_positive { border-color: var(--btp); }
.outcome-card.v-bar-true_positive { border-color: var(--tp); }
.outcome-card.v-bar-inconclusive { border-color: var(--inc); }
.outcome-card h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 600; }
.outcome-card ol, .outcome-card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.outcome-card p { margin: 0; max-width: 72ch; }
.flag { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); background: var(--tp-soft); color: var(--tp); font-weight: 500; }

/* Case file */
.case { display: grid; gap: 16px; min-width: 0; }
.entity-row { display: grid; gap: 3px; }
.entity-row label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.entity-row label code { color: var(--muted); }
.entity-row input { font-family: var(--font-mono); font-size: 13px; padding: 6px 8px; }
.entity-row input:placeholder-shown { border-style: dashed; }

.trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.trail li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.trail li:last-child { border-bottom: 0; }
.trail .n { font-family: var(--font-mono); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.trail button { all: unset; cursor: pointer; display: grid; gap: 1px; min-width: 0; }
.trail button:hover .q { color: var(--accent); }
.trail button:focus-visible { outline: 2px solid var(--focus); border-radius: 3px; }
.trail .q { overflow-wrap: anywhere; }
.trail .a { font-family: var(--font-mono); font-size: 12px; }
.a-yes { color: var(--btp); } .a-no { color: var(--tp); } .a-unknown { color: var(--inc); } .a-other { color: var(--accent); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }

/* Map: left-to-right expandable decision tree */
.mm-toolbar { gap: 8px; }
.mm-canvas { overflow: auto; max-height: 72vh; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 18px; }
.mm-tree { display: inline-flex; min-width: 100%; }
.mm-row { display: flex; align-items: center; }
.mm-children { display: flex; flex-direction: column; justify-content: center; position: relative; margin-left: 26px; }
.mm-children::before { content: ""; position: absolute; left: -26px; top: 50%; width: 26px; border-top: 1.5px solid var(--edge); }
.mm-branch { position: relative; display: flex; align-items: center; gap: 0; padding: 5px 0 5px 22px; }
.mm-branch::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--edge); }
.mm-branch:first-child::before { top: 50%; }
.mm-branch:last-child::before { bottom: 50%; }
.mm-branch:only-child::before { display: none; }
.mm-branch::after { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 1.5px solid var(--edge); }
.mm-took-branch::after { border-top-color: var(--accent); border-top-width: 2.5px; }
.mm-edge {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-right: 8px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); position: relative; z-index: 1;
}
.mm-e-yes { color: var(--btp); } .mm-e-no { color: var(--tp); } .mm-e-unknown { color: var(--inc); } .mm-e-option { color: var(--accent); }
.mm-edge.mm-took { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.mm-card {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "tag toggle" "label label";
  gap: 2px 8px; width: 230px; text-align: left; cursor: pointer; padding: 8px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); flex-shrink: 0;
  transition: border-color .12s, box-shadow .12s;
}
.mm-card:hover { border-color: var(--ink); }
.mm-tag { grid-area: tag; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mm-label { grid-area: label; font-size: 13px; line-height: 1.35; }
.mm-toggle { grid-area: toggle; font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 5px; align-self: start; }
.mm-question { border-left: 3px solid var(--accent); }
.mm-choice { border-left: 3px solid var(--accent); border-style: solid solid solid double; border-left-width: 4px; }
.mm-check { border-left: 3px solid var(--muted); }
.mm-link { border-style: dashed; }
.mm-outcome { border-left-width: 4px; }
.mm-v-false_positive { background: var(--fp-soft); border-left-color: var(--fp); }
.mm-v-benign_positive { background: var(--btp-soft); border-left-color: var(--btp); }
.mm-v-true_positive { background: var(--tp-soft); border-left-color: var(--tp); }
.mm-v-inconclusive { background: var(--inc-soft); border-left-color: var(--inc); }
.mm-v-false_positive .mm-tag { color: var(--fp); } .mm-v-benign_positive .mm-tag { color: var(--btp); }
.mm-v-true_positive .mm-tag { color: var(--tp); } .mm-v-inconclusive .mm-tag { color: var(--inc); }
.mm-seen { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent); }
.mm-here { box-shadow: 0 0 0 3px var(--accent); }
.mm-selected { outline: 2px solid var(--ink); outline-offset: 2px; }
.mm-detail { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.mm-detail p { margin: 0; max-width: 72ch; }
.mm-detail-text { font-family: var(--font-display); font-size: 18px; font-weight: 600; }

/* At a glance */
.glance { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.glance > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
.glance > summary::-webkit-details-marker { display: none; }
.glance > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
.glance[open] > summary::before { transform: rotate(90deg); }
.glance-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.glance-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; margin-top: 10px; }
@media (max-width: 900px) { .glance-grid { grid-template-columns: minmax(0, 1fr); } }
.glance-steps { list-style: none; margin: 4px 0 0; padding: 0; counter-reset: g; display: grid; gap: 2px; }
.glance-steps li { counter-increment: g; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.glance-steps li:last-child { border-bottom: 0; }
.glance-steps li::before { content: counter(g, decimal-leading-zero); font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; }
.g-alts { display: grid; gap: 1px; min-width: 0; }
.g-alt-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: baseline; gap: 2px; }
.g-alt-row .g-step { justify-self: start; }
.g-or { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.g-step {
  all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
  padding: 3px 6px; border-radius: 4px; font-size: 13.5px; max-width: 100%;
}
.g-step:hover { background: var(--surface-2); }
.g-step:hover .g-text { text-decoration: underline; }
.g-step:focus-visible { outline: 2px solid var(--focus); }
.g-type { font-family: var(--font-mono); font-size: 11px; text-align: center; min-width: 18px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.g-question, .g-choice { color: var(--accent); }
.g-text { overflow-wrap: anywhere; }
.g-done .g-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.g-here { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.glance-outcomes { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.glance-outcomes .cat-label { flex-basis: 100%; margin-top: 0; }
.g-out { border: 0; cursor: pointer; font-size: 12.5px; padding: 4px 9px; border-radius: 4px; text-align: left; }
.g-out:hover { filter: brightness(0.96); text-decoration: underline; }
.g-link { background: var(--surface-2); color: var(--accent); border: 1px dashed var(--line); }

/* Note */
.note-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.note-controls label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.toggles { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
#note-out { font-family: var(--font-body); font-size: 14px; min-height: 360px; line-height: 1.6; background: var(--surface); }
.warn { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); background: var(--inc-soft); color: var(--inc); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { font-size: 13px; color: var(--btp); }
.banner { padding: 10px 14px; background: var(--accent-soft); border-radius: var(--radius); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
footer.foot { padding-block: 8px 24px; padding-inline: 16px; text-align: center; color: var(--muted); font-size: 12px; }
footer.foot a { color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topbar">
  <div class="brand">Triage Trees <small>Question-driven SOC investigation playbooks</small></div>
  <div class="spacer"></div>
  <button class="btn small" id="new-case" type="button">New case</button>
</header>

<div class="app">
  <nav class="panel library" aria-label="Playbook library">
    <div class="panel-head"><h2>Playbooks</h2></div>
    <div class="panel-body">
      <input class="search" id="search" type="search" placeholder="Search alert name, MITRE ID..." aria-label="Search playbooks">
      <div id="lib"></div>
    </div>
  </nav>

  <main class="main">
    <div id="banner" hidden></div>
    <section class="panel">
      <div class="tree-head" id="tree-head"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-walk" aria-selected="true" type="button">Walkthrough</button>
        <button class="tab" role="tab" id="tab-map" aria-selected="false" type="button">Map</button>
        <button class="tab" role="tab" id="tab-note" aria-selected="false" type="button">Closure note</button>
      </div>
      <div class="view" id="view-walk" role="tabpanel"></div>
      <div class="view" id="view-map" role="tabpanel" hidden></div>
      <div class="view" id="view-note" role="tabpanel" hidden></div>
    </section>
  </main>

  <aside class="case">
    <section class="panel">
      <div class="panel-head"><h2>Case entities</h2></div>
      <div class="panel-body" id="entities"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Investigation path</h2></div>
      <div class="panel-body"><ol class="trail" id="trail"></ol></div>
    </section>
  </aside>
</div>
<footer class="foot">Trees are YAML in the repository and validated in CI. Edit a tree, open a pull request, and the site rebuilds.</footer>

<script>
const EMBEDDED = /*__TREE_DATA__*/null;

(async function () {
  "use strict";

  // ---------- data ----------
  let bundle = EMBEDDED;
  if (!bundle) {
    try { bundle = await (await fetch("trees.json")).json(); }
    catch (e) { document.getElementById("view-walk").textContent = "Could not load trees.json. Run python tools/build.py first."; return; }
  }
  const TREES = {};

    const cv = h("div", { class: "mm-canvas" }, h("div", { class: "mm-tree" }, mmBranch(t, t.start, t.start, info, 0)));
    v.append(cv, mmDetail(t));
    if (!opts.reset) { cv.scrollLeft = keepX; cv.scrollTop = keepY; }
    const sel = opts.focus ? cv.querySelector(".mm-selected") : null;
    if (sel) {
      const cr0 = cv.getBoundingClientRect(), sr0 = sel.getBoundingClientRect();
      cv.scrollTop += (sr0.top - cr0.top) - cv.clientHeight / 2 + sr0.height / 2;
      const cr = cv.getBoundingClientRect(), sr = sel.getBoundingClientRect();
      if (sr.right + 260 > cr.right || sr.left < cr.left) cv.scrollLeft += sr.left - cr.left - 60;
    }
  }
  function renderMap() { drawMap({ focus: true }); }
  function revealInMap(nid) {
    const t = TREES[S.tree];
    if (mm.tree !== t.id) mmReset(t);
    const k = mmFindKey(t, nid); if (!k) return;
    mmOpenAncestors(k.slice(0, k.lastIndexOf("/")) || t.start);
    mm.selected = k;
    current = "map";
    ["walk", "map", "note"].forEach(x => {
      document.getElementById("tab-" + x).setAttribute("aria-selected", String(x === "map"));
      document.getElementById("view-" + x).hidden = x !== "map";
    });
    drawMap({ focus: true });
    document.getElementById("view-map").scrollIntoView({ block: "start" });
    const el = document.querySelector('.mm-card[data-key="' + CSS.escape(k) + '"]');
    if (el) el.focus({ preventScroll: true });
  }

  // ---------- at a glance ----------
  function renderGlance(t) {
    const order = bfsOrder(t);
    const info = pathInTree(t.id);
    const steps = order.filter(([nid]) => ["check", "question", "choice"].includes(t.nodes[nid].type));
    const outcomes = order.filter(([nid]) => t.nodes[nid].type === "outcome");
    const links = order.filter(([nid]) => t.nodes[nid].type === "link");
    const openState = glanceOpen === null ? S.path.length === 0 : glanceOpen;
    const det = h("details", { class: "glance", open: openState ? true : null },
      h("summary", {}, h("span", { class: "glance-title" }, "At a glance"),
        h("span", { class: "empty" }, steps.length + " steps · " + outcomes.length + " outcomes" + (links.length ? " · links to " + links.length + " other playbook" + (links.length > 1 ? "s" : "") : ""))));
    det.addEventListener("toggle", () => { glanceOpen = det.open; });
    const stages = new Map();
    steps.forEach(([nid, d]) => { if (!stages.has(d)) stages.set(d, []); stages.get(d).push(nid); });
    const list = h("ol", { class: "glance-steps" });
    [...stages.values()].forEach(ids => {
      const li = h("li", {});
      const alts = h("div", { class: "g-alts" });
      ids.forEach((nid, i) => {
        const n = t.nodes[nid];
        const done = info.visited.has(nid) && !(S.tree === t.id && S.node === nid);
        const here = S.tree === t.id && S.node === nid;
        alts.append(h("div", { class: "g-alt-row" }, h("span", { class: "g-or" }, i ? "or" : ""), h("button", { type: "button", class: "g-step" + (done ? " g-done" : "") + (here ? " g-here" : ""), title: "Show in map" + (done ? " (done)" : here ? " (you are here)" : ""), onclick: () => revealInMap(nid) },
          h("span", { class: "g-type g-" + n.type }, n.type === "question" ? "?" : n.type === "check" ? "\u2713" : "\u21C4"),
          h("span", { class: "g-text" }, shortText(n.text)))));
      });
      li.append(alts); list.append(li);
    });
    const verdictOrder = ["true_positive", "inconclusive", "benign_positive", "false_positive"];
    const outs = h("div", { class: "glance-outcomes" }, h("div", { class: "cat-label" }, "Where it can end"));
    verdictOrder.forEach(v => outcomes.filter(([nid]) => t.nodes[nid].verdict === v).forEach(([nid]) => {
      outs.append(h("button", { class: "g-out v-" + v, type: "button", title: VERDICT_LABEL[v] + ": show in map", onclick: () => revealInMap(nid) }, t.nodes[nid].title));
    }));
    links.forEach(([nid]) => outs.append(h("button", { class: "g-out g-link", type: "button", onclick: () => revealInMap(nid) }, "→ " + TREES[t.nodes[nid].tree].title)));
    det.append(h("div", { class: "glance-grid" }, h("div", {}, h("div", { class: "cat-label" }, "Stages in order, with the alternatives at each"), list), outs));
    return det;
  }

  // ---------- closure note ----------
  function findingFor(st) {
    const n = node(st.tree, st.node);
    let base = "";
    if (n.type === "question") base = n.notes[st.answer] || "";
    else if (n.type === "check") base = n.note || "";
    else if (n.type === "choice") { const o = n.options.find(x => x.label === st.label); base = (o && o.note) || ""; }
    else if (n.type === "link") base = n.note || "";
    const ev = (S.evidence[key(st.tree, st.node)] || "").trim();
    return { base, ev };
  }
  function buildNote() {
    const out = node(S.tree, S.node);
    const missing = new Set();
    const lines = [];
    missingIn(out.anchor, missing); missingIn(out.risk, missing); if (out.monitor) missingIn(out.monitor, missing);
    lines.push(VERDICT_OPENER[out.verdict] + " " + fill(out.anchor));
    lines.push("");
    S.path.forEach(st => {
      const f = findingFor(st);
      if (!f.base && !f.ev) return;
      missingIn(f.base, missing);
      let s = fill(f.base);
      if (f.ev) {
        let ev = f.ev.replace(/\s+/g, " ");
        if (!/[.!?]$/.test(ev)) ev += ".";
        s = s ? s.replace(/\.?\s*$/, ". ") + ev : ev;
      }
      lines.push("- " + s.trim());
    });
    lines.push("");
    lines.push(fill(out.risk));
    const act = [];
    if (out.escalate) act.push("I have escalated this for containment per the client RACI.");
    if (S.ticket.trim()) act.push("This is tracked under " + S.ticket.trim() + ".");
    if (act.length) { lines.push(""); lines.push(act.join(" ")); }
    if (out.monitor) { lines.push(""); lines.push(fill(out.monitor)); }
    if (S.incActions) { lines.push(""); lines.push("Recommended actions:"); out.actions.forEach((a, i) => lines.push((i + 1) + ". " + fill(a))); }
    if (S.incSteps) {
      lines.push(""); lines.push("Investigative steps:");
      S.path.forEach(st => { const n = node(st.tree, st.node); if (n.type === "link") return; lines.push("- " + fill(n.text) + " " + answerLabel(st) + "."); });
    }
    if (S.signoff.trim()) { lines.push(""); lines.push(S.signoff.trim()); }
    return { text: lines.join("\n").replace(/\n{3,}/g, "\n\n"), missing: [...missing] };
  }
  function renderNote() {
    const v = document.getElementById("view-note"); v.replaceChildren();
    const n = node(S.tree, S.node);
    if (n.type !== "outcome") {
      v.append(h("p", {}, "Reach an outcome in the walkthrough first. The note is written from the path you take and the evidence you record at each step."));
      v.append(h("div", {}, h("button", { class: "btn primary", type: "button", onclick: () => selectTab("walk") }, "Back to walkthrough")));
      return;
    }
    const ticket = h("input", { class: "field", id: "note-ticket", type: "text", placeholder: "e.g. INC0012345" }); ticket.value = S.ticket;
    const sign = h("input", { class: "field", id: "note-sign", type: "text", placeholder: "e.g. Kind regards, Your name" }); sign.value = S.signoff;
    const incA = h("input", { type: "checkbox", id: "note-actions" }); incA.checked = S.incActions;
    const incS = h("input", { type: "checkbox", id: "note-steps" }); incS.checked = S.incSteps;
    const warn = h("div", { class: "warn", hidden: true });
    const out = h("textarea", { id: "note-out", spellcheck: "true" });
    const copyBtn = h("button", { class: "btn primary", type: "button", onclick: () => copy(out.value, copyBtn) }, "Copy note");
    const regen = () => {
      const r = buildNote(); out.value = r.text;
      if (r.missing.length) { warn.hidden = false; warn.textContent = "Missing values: " + r.missing.map(labelFor).join(", ") + ". Fill them in under Case entities so the note carries real values."; }
      else warn.hidden = true;
    };
    ticket.addEventListener("input", () => { S.ticket = ticket.value; save(); regen(); });
    sign.addEventListener("input", () => { S.signoff = sign.value; save(); regen(); });
    incA.addEventListener("change", () => { S.incActions = incA.checked; save(); regen(); });
    incS.addEventListener("change", () => { S.incSteps = incS.checked; save(); regen(); });
    v.append(
      h("div", { class: "row" }, h("span", { class: "verdict v-" + n.verdict }, VERDICT_LABEL[n.verdict]), h("strong", {}, n.title)),
      h("div", { class: "note-controls" },
        h("label", { for: "note-ticket" }, "Ticket reference", ticket),
        h("label", { for: "note-sign" }, "Sign-off", sign)),
      h("div", { class: "toggles" },
        h("label", { for: "note-actions" }, incA, "Include recommended actions"),
        h("label", { for: "note-steps" }, incS, "Include investigative steps")),
      warn, out,
      h("div", { class: "row" }, copyBtn, h("span", { class: "empty" }, "Edit freely before copying. Regenerating happens when you change the fields above.")));
    regen();
  }
  let liveTimer = null;
  function refreshLive() {
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => { renderWalk(); renderTrail(); if (current === "note") renderNote(); }, 250);
  }

  // ---------- tabs ----------
  let current = "walk";
  function selectTab(name) {
    current = name;
    ["walk", "map", "note"].forEach(t => {
      document.getElementById("tab-" + t).setAttribute("aria-selected", String(t === name));
      document.getElementById("view-" + t).hidden = t !== name;
    });
    if (name === "map") renderMap();
    if (name === "note") renderNote();
  }
  ["walk", "map", "note"].forEach(t => document.getElementById("tab-" + t).addEventListener("click", () => selectTab(t)));

  function render() {
    renderLibrary(); renderHead(); renderWalk(); renderEntities(); renderTrail();
    if (current === "map") renderMap();
    if (current === "note") renderNote();
  }

  document.getElementById("search").addEventListener("input", renderLibrary);
  document.getElementById("new-case").addEventListener("click", () => {
    if (S.path.length) previous = JSON.parse(JSON.stringify(S));
    const tid = S.tree; S = blank(); S.tree = "universal-triage" in TREES ? "universal-triage" : tid; S.node = TREES[S.tree].start;
    save(); render(); showBanner();
  });
  window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (TREES[id] && id !== S.tree) startTree(id); });

  render();
})();
</script>
