id: kubernetes-suspicious-workload
title: Suspicious Kubernetes Workload or Access
category: cloud
summary: >-
  Exec into a pod, a privileged container or one with a host mount, a new ClusterRoleBinding,
  secrets read in bulk, or anonymous API access. Each can lead from one pod to the node and
  the whole cluster.
applies_to:
  - Execution:Kubernetes/ExecInKubeSystemPod
  - PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer
  - CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed
  - Policy:Kubernetes/AnonymousAccessGranted
mitre: [T1609, T1610, T1611, T1552.007]
version: 1.2.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: AWS GuardDuty finding types (Kubernetes)
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-active.html
  - title: Microsoft threat matrix for Kubernetes
    url: https://microsoft.github.io/Threat-Matrix-for-Kubernetes/
entities:
  - { key: cluster, label: Cluster, example: "aks-prod-weu" }
  - { key: principal, label: Kubernetes user or service account, example: "system:serviceaccount:default:web" }
start: c-audit
nodes:
  c-audit:
    type: check
    text: Pull the API calls made by the principal.
    also_check:
      - "Did {{principal}} enumerate namespaces, pods, roles or its own permissions (SelfSubjectRulesReview)?"
      - "Were audit logging or admission controls in {{cluster}} changed or disabled?"
    kql:
      - title: AKS audit events by the principal (48h)
        platform: sentinel
        query: |
          AzureDiagnostics
          | where TimeGenerated > ago(48h)
          | where Category == "kube-audit" and Resource =~ "{{cluster}}"
          | extend A = parse_json(log_s)
          | extend User = tostring(A.user.username), Verb = tostring(A.verb), Uri = tostring(A.requestURI), Code = toint(A.responseStatus.code)
          | where User =~ "{{principal}}" or Uri has_any ("/exec", "clusterrolebindings", "/secrets")
          | project TimeGenerated, User, Verb, Uri, Code, SourceIPs = tostring(A.sourceIPs)
    note: I pulled the API calls made by {{principal}} in {{cluster}}.
    next: q-platform

  q-platform:
    type: question
    text: Is the principal a platform component or CI/CD identity doing its normal job (GitOps controller, monitoring agent, a known SRE)?
    yes: q-external-source
    no: q-escalation
    notes:
      yes: "{{principal}} is a platform or CI/CD identity doing its normal job."
      no: "{{principal}} is not a platform identity, or acted outside its normal job."

  q-escalation:
    type: question
    text: Did it create privileged pods, host mounts, cluster-admin bindings, or read secrets across namespaces?
    also_check:
      - "Did {{principal}} create new service accounts, tokens, Roles or RoleBindings?"
      - "Did {{principal}} create CronJobs or DaemonSets?"
      - "Was anonymous or unauthenticated access to the API server granted or used?"
      - "Did a pod query the cloud instance metadata service for node or cloud credentials?"
    yes: o-tp
    no: o-inconclusive
    notes:
      yes: "{{principal}} created privileged workloads or bindings, or read secrets across namespaces."
      no: "{{principal}} did not escalate privilege."

  q-external-source:
    type: question
    text: Did the API calls come from an IP outside the cluster, CI/CD or admin networks, or one flagged in threat intelligence?
    why: A yes means the platform identity's token or kubeconfig may be in someone else's hands, even if the calls look like its normal job.
    yes: o-external-token
    no: q-mining
    notes:
      yes: I found API calls by {{principal}} in {{cluster}} from an IP outside the cluster, CI/CD or admin networks, or flagged in threat intelligence.
      no: I found that the API calls by {{principal}} in {{cluster}} came from the cluster, CI/CD or admin networks, with no threat intelligence match.

  q-mining:
    type: question
    text: Did pods started by {{principal}} connect to mining pools or unusual external domains or IPs?
    why: A yes means the workloads are abusing the cluster or talking to attacker infrastructure, whoever deployed them.
    yes: l-cryptomining-traffic
    no: o-fp
    notes:
      yes: I found pods started by {{principal}} in {{cluster}} connecting to mining pools or unusual external domains or IPs.
      no: I found no connections from pods started by {{principal}} in {{cluster}} to mining pools or unusual external domains or IPs.

  l-cryptomining-traffic:
    type: link
    text: Continue in Cryptomining Pool Traffic
    tree: cryptomining-traffic

  o-external-token:
    type: outcome
    verdict: inconclusive
    title: Platform identity used from outside
    anchor: "{{principal}} did its normal job in {{cluster}}, but some API calls came from an IP outside the cluster, CI/CD or admin networks."
    risk: The risk here is a stolen service account token or kubeconfig used to act as a trusted platform identity; it stays open until the platform team confirms the source.
    actions:
      - Ask the platform team to confirm the source IP belongs to them
      - If not confirmed, revoke and reissue the token for {{principal}} and review everything it did from that IP
      - Escalate to the customer's platform or cloud team
    monitor: I will monitor {{principal}} for API calls from outside the cluster, CI/CD and admin networks.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Platform activity
    anchor: The activity by {{principal}} in {{cluster}} is normal platform or CI/CD behaviour.
    risk: The risk here is container escape and cluster takeover; it doesn't apply given the known identity.
    actions:
      - Close

  o-inconclusive:
    type: outcome
    verdict: inconclusive
    title: Unusual but not escalating
    anchor: "{{principal}} acted outside its normal pattern in {{cluster}} without escalating privilege."
    risk: The risk here is a compromised workload probing the cluster, which stays open until the owning team explains it.
    actions:
      - Ask the owning team to explain the activity
    monitor: I will monitor {{principal}} for privileged workloads and secret reads.

  o-tp:
    type: outcome
    verdict: true_positive
    title: Kubernetes privilege escalation
    anchor: "{{principal}} escalated privilege in {{cluster}} through privileged workloads, bindings or bulk secret reads."
    risk: The risk here is node and cluster takeover and theft of every secret in the cluster; containment is required now.
    actions:
      - Delete the rogue pods and bindings; cordon affected nodes
      - Revoke the principal's token and rotate secrets that were read
      - Find the entry point (exposed dashboard, vulnerable app, leaked kubeconfig)
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor {{cluster}} for privileged pods, new bindings and exec into pods.
