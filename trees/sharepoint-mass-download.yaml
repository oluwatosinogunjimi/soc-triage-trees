id: sharepoint-mass-download
title: SharePoint or OneDrive Mass Download
category: cloud
summary: >-
  A user or app downloaded or synced an unusual number of files. Leavers taking data,
  compromised accounts and OAuth apps all look like this. So does a new laptop syncing
  OneDrive for the first time.
applies_to:
  - Unusual multiple file download activities
  - Mass Access to Sensitive Files
  - Suspicious OAuth app file download activities
mitre: [T1530, T1213.002]
version: 1.2.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: Defender for Cloud Apps anomaly detection policies
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - title: "MITRE ATT&CK T1213.002 Data from Information Repositories: SharePoint"
    url: https://attack.mitre.org/techniques/T1213/002/
entities:
  - { key: user, label: User principal name, example: "jdoe@contoso.com" }
start: c-downloads
nodes:
  c-downloads:
    type: check
    text: Measure the downloads by site, client and IP.
    also_check:
      - "Did {{user}} search for or open sensitive content (passwords, finance, HR) outside their usual sites?"
      - "Has {{user}} emailed files to personal addresses?"
    kql:
      - title: Downloads and syncs by the user (7d)
        platform: sentinel
        query: |
          OfficeActivity
          | where TimeGenerated > ago(7d)
          | where UserId =~ "{{user}}"
          | where Operation in~ ("FileDownloaded", "FileSyncDownloadedFull", "FileAccessed", "FileCopied")
          | summarize Files = count(), Sites = make_set(Site_Url, 10), First = min(TimeGenerated), Last = max(TimeGenerated)
                    by ClientIP, UserAgent, Operation
          | order by Files desc
    note: I measured the downloads by {{user}} by site, client and IP.
    next: q-sync

  q-sync:
    type: question
    text: Is it a first sync on a new managed device, or a known app, from the user's usual network?
    yes: q-shared-out
    no: q-account-risk
    notes:
      yes: The downloads by {{user}} are a sync to a new managed device or a known app.
      no: The downloads by {{user}} came from an unusual client, IP or app.

  q-shared-out:
    type: question
    text: Has {{user}} shared files externally or created anonymous links?
    why: A yes means the files may be leaving the organisation after the sync, which a managed device does not explain.
    yes: l-mass-external-sharing
    no: q-removable-media
    notes:
      yes: I found that {{user}} shared files externally or created anonymous links.
      no: I found no external sharing or anonymous links created by {{user}}.

  l-mass-external-sharing:
    type: link
    text: Continue in Mass External or Anonymous Sharing
    tree: mass-external-sharing

  q-removable-media:
    type: question
    text: Has {{user}} copied files to removable media or uploaded them to personal cloud storage?
    why: A yes means the synced files were moved off managed storage, which turns a routine sync into possible data theft.
    yes: l-usb-data-transfer
    no: o-fp
    notes:
      yes: I found that {{user}} copied files to removable media or uploaded them to personal cloud storage.
      no: I found no copying of files to removable media and no uploads to personal cloud storage by {{user}}.

  l-usb-data-transfer:
    type: link
    text: Continue in Large Copy to Removable Media
    tree: usb-data-transfer

  q-account-risk:
    type: question
    text: Is the session suspicious (unfamiliar IP, risky sign-in, OAuth app, token anomaly)?
    also_check:
      - "Did {{user}} have failed sign-ins or MFA denials before the session?"
      - "Has {{user}} registered or changed an MFA method recently?"
      - "Has {{user}} created inbox rules that forward or delete mail?"
    yes: o-tp-compromise
    no: q-insider
    notes:
      yes: The session that downloaded the files was suspicious.
      no: The session was the user's own normal session.

  q-insider:
    type: question
    text: Is the user leaving or under HR concern, or did they take data outside their role (check through the agreed contact)?
    yes: o-tp-insider
    no: o-inconclusive
    notes:
      yes: "{{user}} is leaving or under HR concern, or took data outside their role."
      no: HR raised no concern and the data is within the role of {{user}}.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Device sync or known app
    anchor: The downloads by {{user}} were a first sync on a managed device or a known app.
    risk: The risk here is bulk data theft; it doesn't apply given the managed device and usual network.
    actions:
      - Close

  o-inconclusive:
    type: outcome
    verdict: inconclusive
    title: Unusual volume, no risk context
    anchor: "{{user}} downloaded an unusual number of files in their own session, with no HR or compromise context."
    risk: The risk here is data leaving the organisation, which stays open until the purpose is confirmed.
    actions:
      - Ask the user's manager to confirm the purpose
    monitor: I will monitor {{user}} for further bulk downloads and external sharing.

  o-tp-compromise:
    type: outcome
    verdict: true_positive
    title: Data taken through a compromised session
    anchor: Files were downloaded in bulk from a suspicious session of {{user}}.
    risk: The risk here is a data breach through account takeover; containment is required now.
    actions:
      - Revoke sessions, reset the password and review OAuth apps for {{user}}
      - List the files downloaded and their sensitivity
      - Escalate to the customer
    escalate: true
    monitor: I will monitor {{user}} for further downloads and sign-ins from new infrastructure.

  o-tp-insider:
    type: outcome
    verdict: true_positive
    title: Probable insider data theft
    anchor: "{{user}}, who is leaving or under HR concern, downloaded company files in bulk."
    risk: The risk here is theft of company data by an insider; the business needs to act quickly and quietly.
    actions:
      - Escalate to the customer's security lead, HR and legal through the agreed channel
      - Preserve the file list and do not alert the user
    escalate: true
    monitor: I will monitor {{user}} for further downloads, sharing and USB activity.
