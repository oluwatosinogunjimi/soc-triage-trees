id: rmm-tool-unauthorised
title: Unauthorised Remote Access Tool
category: endpoint
summary: >-
  AnyDesk, ScreenConnect, TeamViewer, Atera, NetSupport, Quick Assist or similar was
  installed or run. These are legitimate products and a favourite of ransomware crews and
  callback scammers. The customer's approved tool list decides most of these.
applies_to:
  - Suspicious remote monitoring and management (RMM) tool
  - AnyDesk / ScreenConnect installed
  - Quick Assist session started after unsolicited contact
mitre: [T1219]
version: 1.3.3
last_reviewed: 2026-10-19
authors: [Oluwatosin Ogunjimi]
sources:
  - title: "MITRE ATT&CK T1219 Remote Access Tools"
    url: https://attack.mitre.org/techniques/T1219/
  - title: CISA advisory AA23-025A, malicious use of RMM software
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a
  - title: GoTo support, how GoTo Meeting installs updates automatically
    url: https://support.goto.com/article/g2m010015
entities:
  - { key: device, label: Device name, example: "WKS-FIN-023" }
  - { key: file, label: Tool executable, example: "AnyDesk.exe" }
start: c-tool
nodes:
  c-tool:
    type: check
    text: Identify the tool, how it arrived and whether it connected out.
    kql:
      - title: RMM processes, installs and connections on the device (7d)
        platform: xdr
        query: |
          let rmm = dynamic(["anydesk", "teamviewer", "screenconnect", "connectwise", "atera", "netsupport", "client32",
                             "splashtop", "rustdesk", "logmein", "supremo", "remoteutilities", "quickassist", "zoho", "tacticalrmm", "meshagent"]);
          union
            (DeviceProcessEvents | where FileName has_any (rmm) or ProcessCommandLine has_any (rmm)
               | project Timestamp, DeviceName, Kind = "Process", Detail = ProcessCommandLine, Parent = InitiatingProcessFileName, AccountName),
            (DeviceNetworkEvents | where InitiatingProcessFileName has_any (rmm) and RemoteIPType == "Public"
               | project Timestamp, DeviceName, Kind = "Network", Detail = strcat(RemoteUrl, " ", RemoteIP), Parent = InitiatingProcessFileName, AccountName = InitiatingProcessAccountName)
          | where Timestamp > ago(7d)
          | where DeviceName =~ "{{device}}"
          | order by Timestamp asc
      - title: Estate prevalence of the tool (30d)
        platform: xdr
        query: |
          DeviceProcessEvents
          | where Timestamp > ago(30d)
          | where FileName =~ "{{file}}"
          | summarize Devices = dcount(DeviceName), DeviceList = make_set(DeviceName, 20)
    note: I identified {{file}} on {{device}}, how it arrived and whether it connected out.
    on_empty: >-
      No rows can mean missing data, not a clean result: Defender for Endpoint only reports devices that
      are onboarded and online. Check the value matches how the table records it and the time window is
      long enough, and confirm DeviceProcessEvents returns rows for another device before you answer.
    next: q-tamper

  q-tamper:
    type: question
    text: Were security tools on {{device}} disabled or changed, or event logs cleared, after {{file}} appeared?
    why: Neither IT support nor a user's own session needs to blind the host, so a yes means someone used the remote access to attack it.
    yes: o-tp-active
    no: q-new-admin
    notes:
      yes: I found security tools on {{device}} were disabled or changed, or event logs cleared, after {{file}} appeared.
      no: I found no security tool changes or log clearing on {{device}} after {{file}} appeared.

  q-new-admin:
    type: question
    text: Was a new local account created or added to the administrators group on {{device}}?
    why: A new admin account after a remote access tool appears is a classic backdoor for return access, so a yes means hands-on intrusion.
    yes: o-tp-active
    no: q-component
    notes:
      yes: I found a new local account was created or added to the administrators group on {{device}}.
      no: I found no new local accounts or administrators group changes on {{device}}.

  q-component:
    type: question
    text: Is {{file}} only a background component (updater, log uploader) of a meeting or collaboration app from a remote access vendor, launched by Task Scheduler, with no remote session?
    why: >-
      Some remote access vendors also make meeting apps. Their updaters match vendor-name detections
      (GoTo Meeting's g2mupdate.exe and g2mupload.exe match on LogMeIn) but give no one control of the
      device. A parent of svchost.exe -k netsvcs -p -s Schedule and no interactive client launches point here.
    kql:
      - title: Every binary from the same vendor on the device, with parent (30d)
        platform: xdr
        query: |
          let vendor = DeviceProcessEvents
            | where Timestamp > ago(30d)
            | where DeviceName =~ "{{device}}" and FileName =~ "{{file}}"
            | take 1
            | project ProcessVersionInfoCompanyName;
          DeviceProcessEvents
          | where Timestamp > ago(30d)
          | where DeviceName =~ "{{device}}"
          | where ProcessVersionInfoCompanyName in (vendor)
          | summarize FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Runs = count()
              by FileName, FolderPath, ProcessVersionInfoProductName, InitiatingProcessCommandLine, AccountName
          | order by FirstSeen asc
    on_empty: >-
      No rows can mean missing data, not a clean result: Defender for Endpoint only reports devices that
      are onboarded and online. Check the value matches how the table records it and the time window is
      long enough, and confirm DeviceProcessEvents returns rows for another device before you answer.
    yes: o-fp-component
    no: q-approved
    notes:
      yes: "{{file}} on {{device}} is only a scheduled background component of a meeting app, and no interactive client or remote session ran."
      no: "{{file}} is a remote access component, or the vendor's interactive client also ran on {{device}}."

  q-approved:
    type: question
    text: Is this tool on the customer's approved list and deployed by IT (their tenant ID or relay, managed install)?
    yes: o-fp
    no: q-trigger
    notes:
      yes: "{{file}} is the customer's approved remote access tool, deployed by IT."
      no: "{{file}} is not on the customer's approved list."

  q-trigger:
    type: question
    text: Did it follow unsolicited contact (callback lure, Teams "helpdesk", email bomb) or appear from a script or another RMM tool?
    also_check:
      - "Did {{file}} install itself as a service or startup entry for unattended access?"
    yes: q-session
    no: q-user-reason
    notes:
      yes: "{{file}} appeared after unsolicited contact or was dropped by a script."
      no: "{{file}} was installed by the user without any preceding lure."

  q-user-reason:
    type: question
    text: Does the user have a legitimate reason (vendor support session, personal use against policy)?
    yes: o-policy
    no: q-session
    notes:
      yes: The user installed {{file}} for a vendor support session or personal use.
      no: The user cannot explain {{file}}.

  q-session:
    type: question
    text: Was a remote session established, followed by other activity (new tools, credential access, discovery, data transfer)?
    also_check:
      - "Were other scheduled tasks, services or startup entries created on {{device}} after {{file}} appeared?"
      - "Has {{device}} connected to previously unseen external domains or IPs other than the tool's relay?"
    yes: o-tp-active
    no: o-tp-contained
    notes:
      yes: A remote session was established on {{device}} and followed by further activity.
      no: No remote session or follow-on activity occurred.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Approved IT tool
    anchor: "{{file}} on {{device}} is the customer's approved remote access tool, deployed by IT."
    risk: The risk here is attacker remote access through RMM software; it doesn't apply as this is the managed instance.
    actions:
      - Close
    tuning: Exclude the approved tool by signer plus the customer's tenant or relay, not by name alone.

  o-fp-component:
    type: outcome
    verdict: false_positive
    title: Meeting app background component
    anchor: "{{file}} on {{device}} is a scheduled updater or log uploader for a meeting app from a remote access vendor, and no remote session took place."
    risk: The risk here is attacker remote access through RMM software; it doesn't apply because the component only updates the app or uploads its logs and gives no one control of the device.
    actions:
      - Ask the user whether they still need the app
      - { type: remediate, text: "Remove the app if it is unused, since its scheduled tasks keep it running", approval: System owner or per client RACI }
      - Close
    tuning: Exclude the meeting app's install path with Task Scheduler as the parent, and keep the same vendor's remote support products (for example GoToAssist, GoTo Resolve, LogMeIn Rescue) in scope.

  o-policy:
    type: outcome
    verdict: benign_positive
    title: Unapproved but explained use
    anchor: The user installed {{file}} on {{device}} for a support session or personal use, against policy.
    risk: The risk here is an unmanaged remote access channel that attackers can reuse; removing it closes the exposure.
    actions:
      - { type: remediate, text: "Remove the tool and remind the user of policy", approval: System owner or per client RACI }
      - Recommend application control that blocks unapproved RMM tools

  o-tp-contained:
    type: outcome
    verdict: true_positive
    title: Social-engineered RMM install, no session
    anchor: "{{file}} was installed on {{device}} after social engineering, and no remote session took place."
    risk: The risk here is hands-on-keyboard access leading to ransomware; it doesn't apply as no session was established.
    actions:
      - { type: remediate, text: "Remove the tool and block its hash and relay domains", approval: System owner or per client RACI }
      - { type: notify, text: "Brief the user" }
    monitor: I will monitor {{device}} for remote access tools over the next 7 days.

  o-tp-active:
    type: outcome
    verdict: true_positive
    title: Attacker remote session
    anchor: An attacker used {{file}} to access {{device}} and carried out further activity.
    risk: The risk here is hands-on-keyboard intrusion that commonly ends in ransomware; containment is required now.
    actions:
      - { type: contain, text: "Isolate {{device}} per client RACI", approval: SOC lead or per client RACI, reversible: true }
      - { type: contain, text: "Kill and remove the tool and any others installed", approval: SOC lead or per client RACI, reversible: false }
      - { type: remediate, text: "Reset credentials used on the device", approval: System owner or per client RACI, reversible: false }
      - { type: enrich, text: "Scope follow-on activity (tools, discovery, lateral movement)" }
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor the estate for the same tool, relay and attacker infrastructure.
