id: secret-exposed-repo
title: Secret Exposed in a Code Repository
category: cloud
summary: >-
  Secret scanning found a cloud key, token, password or connection string committed to a
  repository, pipeline log or package. Bots scan public repos within minutes, so assume a
  public secret is already harvested. Rotate first, then look for use.
applies_to:
  - GitHub secret scanning alert
  - Azure DevOps credential scanner finding
  - Possible account secret leak
  - Possible service principal account secret leak
mitre: [T1552.001, T1593.003]
version: 1.1.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: GitHub secret scanning
    url: https://docs.github.com/en/code-security/secret-scanning/about-secret-scanning
  - title: "MITRE ATT&CK T1552.001 Credentials In Files"
    url: https://attack.mitre.org/techniques/T1552/001/
entities:
  - { key: repo, label: Repository, example: "contoso/payments-api" }
  - { key: secret_id, label: Key ID or secret identifier, example: "AKIAEXAMPLE1234567" }
start: c-secret
nodes:
  c-secret:
    type: check
    text: Identify the secret, what it grants and how long it was exposed.
    look_for:
      - Secret type and what it can access (cloud account, database, SaaS API)
      - Repository visibility (public, internal, private) and fork count
      - Commit time, whether it is still in history, and who committed it
    also_check:
      - "Are other secrets exposed in {{repo}}, its history or its pipeline logs?"
      - "Did the committer's account add new SSH keys or access tokens, or sign in from an unfamiliar location?"
      - "Were branch protections, pipeline secrets or push protection settings for {{repo}} changed recently?"
    note: I identified secret {{secret_id}} in {{repo}}, what it grants and how long it was exposed.
    next: q-valid

  q-valid:
    type: question
    text: Is the secret still valid (not a test value, not already rotated)?
    yes: q-public
    no: o-fp
    notes:
      yes: Secret {{secret_id}} is still valid.
      no: Secret {{secret_id}} is a test value or already rotated.

  q-public:
    type: question
    text: Is or was the repository public (or the secret in a public package or log)?
    also_check:
      - "Has {{repo}} been cloned or downloaded unusually often since the commit?"
    yes: q-used
    no: q-used
    notes:
      yes: "{{repo}} is or was public, so the secret must be treated as harvested."
      no: "{{repo}} is private, which limits but does not remove exposure."

  q-used:
    type: question
    text: Was the secret used from any unexpected source since the commit?
    also_check:
      - "Were new users, credentials or role assignments created with {{secret_id}}?"
      - "Was {{secret_id}} used to read other secrets or key material (secrets manager, key vault)?"
    kql:
      - title: AWS calls with the key since exposure (30d)
        platform: sentinel
        query: |
          AWSCloudTrail
          | where TimeGenerated > ago(30d)
          | where UserIdentityAccessKeyId == "{{secret_id}}"
          | summarize Calls = count(), Events = make_set(EventName, 30), First = min(TimeGenerated) by SourceIpAddress, UserAgent
      - title: Service principal sign-ins with the app (30d)
        platform: sentinel
        query: |
          AADServicePrincipalSignInLogs
          | where TimeGenerated > ago(30d)
          | where AppId == "{{secret_id}}" or ServicePrincipalId == "{{secret_id}}"
          | summarize SignIns = count(), First = min(TimeGenerated) by IPAddress, ResourceDisplayName
    yes: l-creds
    no: o-rotate
    notes:
      yes: Secret {{secret_id}} was used from an unexpected source after exposure.
      no: I found no use of secret {{secret_id}} from unexpected sources.

  l-creds:
    type: link
    text: The key was used. Continue in the credential misuse tree.
    tree: aws-credential-exfiltration
    node: q-actions

  o-fp:
    type: outcome
    verdict: false_positive
    title: Invalid or test secret
    anchor: Secret {{secret_id}} in {{repo}} is a test value or already rotated.
    risk: The risk here is credential abuse from a leaked secret; it doesn't apply as the secret no longer works.
    actions:
      - Close the scanning alert
      - Ask the team to remove it from history anyway

  o-rotate:
    type: outcome
    verdict: true_positive
    title: Live secret exposed, no use found
    anchor: Secret {{secret_id}} in {{repo}} is valid and exposed, and I found no use of it from unexpected sources.
    risk: The risk here is credential abuse by anyone who harvested it; rotating it now closes the exposure.
    actions:
      - Revoke and rotate the secret immediately
      - Remove it from the repository history and any forks or packages
      - Recommend push protection and a secrets manager for this team
    escalate: true
    monitor: I will monitor for any use of the old secret identifier.
