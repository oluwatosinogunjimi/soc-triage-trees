id: suspicious-service-install
title: Suspicious Service Installation
category: endpoint
summary: >-
  A new Windows service was installed with an unusual binary or command line, often
  PsExec-style remote execution, Impacket, or a persistence mechanism. Check where the
  install came from: locally or from another host over the network.
applies_to:
  - Suspicious remote service installation
  - Suspicious service creation (Event 7045 / 4697)
  - PsExec service installed
mitre: [T1543.003, T1569.002]
version: 1.2.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: "MITRE ATT&CK T1543.003 Windows Service"
    url: https://attack.mitre.org/techniques/T1543/003/
  - title: "MITRE ATT&CK T1569.002 Service Execution"
    url: https://attack.mitre.org/techniques/T1569/002/
entities:
  - { key: device, label: Device name, example: "SRV-APP02" }
  - { key: service, label: Service name, example: "BTOBTO" }
start: c-service
nodes:
  c-service:
    type: check
    text: Read the service binary path and the install context.
    also_check:
      - "Were other persistence entries created on {{device}} around the same time (scheduled tasks, Run keys, WMI subscriptions)?"
    kql:
      - title: Service installs on the device (7d)
        platform: xdr
        query: |
          DeviceEvents
          | where Timestamp > ago(7d)
          | where DeviceName =~ "{{device}}" and ActionType == "ServiceInstalled"
          | extend AF = parse_json(AdditionalFields)
          | project Timestamp, ServiceName = tostring(AF.ServiceName), ServiceFileName = tostring(AF.ServiceFileName),
                    ServiceStartType = tostring(AF.ServiceStartType), ServiceAccount = tostring(AF.ServiceAccount),
                    InitiatingProcessFileName, InitiatingProcessAccountName
      - title: Remote logons just before the install (7d)
        platform: xdr
        query: |
          DeviceLogonEvents
          | where Timestamp > ago(7d)
          | where DeviceName =~ "{{device}}" and LogonType == "Network" and ActionType == "LogonSuccess"
          | project Timestamp, AccountName, RemoteIP, RemoteDeviceName, Protocol
    note: I read service "{{service}}" on {{device}} and its install context.
    next: q-lsass

  q-lsass:
    type: question
    text: Has anyone tried to dump credentials from LSASS, SAM or NTDS.dit on {{device}}?
    why: A yes means credential theft on the host, which rules out a benign close however ordinary the service looks.
    yes: l-lsass-credential-dumping
    no: q-tamper
    notes:
      yes: I found an attempt to dump credentials from LSASS, SAM or NTDS.dit on {{device}}.
      no: I found no attempt to dump credentials from LSASS, SAM or NTDS.dit on {{device}}.

  q-tamper:
    type: question
    text: Were security tools disabled or event logs cleared on {{device}} around the install?
    why: Product installers and admin tooling do not blind the host, so a yes means the install is part of an attack.
    yes: l-security-tool-tampering
    no: q-known
    notes:
      yes: I found security tools were disabled or event logs cleared on {{device}} around the install.
      no: I found no security tool changes or log clearing on {{device}} around the install.

  q-known:
    type: question
    text: Is it a known product service (signed binary in Program Files or System32, deployed by IT or an installer)?
    yes: o-fp
    no: q-remote
    notes:
      yes: Service "{{service}}" belongs to a known product.
      no: Service "{{service}}" does not belong to any known product.

  q-remote:
    type: question
    text: Was it installed remotely (network logon then install, random service name, cmd /c or powershell in the binary path, ADMIN$ writes)?
    yes: q-admin-tooling
    no: q-binary
    notes:
      yes: Service "{{service}}" was installed remotely in a pattern matching PsExec or Impacket.
      no: Service "{{service}}" was installed locally.

  q-admin-tooling:
    type: question
    text: Is the remote install explained by an admin's normal remote tooling from their usual host, with a ticket?
    yes: q-priv-no-request
    no: l-lateral
    notes:
      yes: The remote install came from normal admin tooling from a known admin host.
      no: The remote install has no admin explanation.

  q-priv-no-request:
    type: question
    text: Was the account behind the install recently added to a privileged group without an approved request?
    why: Normal admin tooling only explains the install if the admin rights are legitimate; unapproved rights mean the account is being abused for lateral movement.
    yes: l-lateral
    no: o-benign-admin
    notes:
      yes: I found the account behind service "{{service}}" was recently added to a privileged group without an approved request.
      no: I found no recent unapproved privilege change for the account behind service "{{service}}".

  q-binary:
    type: question
    text: Is the service binary malicious or unknown and unsigned from a user-writable path?
    also_check:
      - "Did a process request administrative privileges unexpectedly or use a UAC bypass on {{device}} before the install?"
      - "Has the service binary connected to previously unseen external domains or IPs, or shown beaconing?"
    yes: l-edr
    no: o-inconclusive
    notes:
      yes: The binary for "{{service}}" is malicious or unsigned from a user-writable path.
      no: The binary for "{{service}}" is unknown but not obviously malicious.

  l-lateral:
    type: link
    text: This is lateral movement. Continue in the remote execution tree.
    tree: remote-execution-lateral

  l-edr:
    type: link
    text: Continue in the EDR tree for the service binary.
    tree: edr-malware-detection
    node: q-executed

  l-lsass-credential-dumping:
    type: link
    text: Continue in LSASS Credential Dumping
    tree: lsass-credential-dumping

  l-security-tool-tampering:
    type: link
    text: Continue in Antivirus or EDR Tampering
    tree: security-tool-tampering

  o-fp:
    type: outcome
    verdict: false_positive
    title: Known product service
    anchor: Service "{{service}}" on {{device}} belongs to a known product with a signed binary.
    risk: The risk here is persistence or remote execution through a service; it doesn't apply given the known product.
    actions:
      - Close

  o-benign-admin:
    type: outcome
    verdict: benign_positive
    title: Admin remote execution
    anchor: Service "{{service}}" was installed on {{device}} by an admin's normal remote tooling.
    risk: The risk here is attacker lateral movement using the same technique; it doesn't apply given the known admin host and ticket.
    actions:
      - Close referencing the ticket

  o-inconclusive:
    type: outcome
    verdict: inconclusive
    title: Unknown local service
    anchor: Service "{{service}}" on {{device}} runs an unknown binary that I could not attribute.
    risk: The risk here is persistence for unidentified software, which stays open until it is identified.
    actions:
      - Ask IT or the device owner to identify the software
      - Submit the binary for analysis
    monitor: I will monitor {{device}} for activity from the service binary.
