id: network-device-config-change
title: Firewall or Network Device Configuration Change
category: network
summary: >-
  An admin logged on to a firewall, router, switch or VPN appliance and changed rules, NAT,
  admin accounts or logging. Attackers who reach these devices open inbound access or
  disable logging. Every change should map to a ticket.
applies_to:
  - Firewall policy modified
  - New admin account on network device
  - Logging disabled on firewall
  - Admin login to network device from unusual source
mitre: [T1562.004, T1098]
version: 1.2.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: "MITRE ATT&CK T1562.004 Disable or Modify System Firewall"
    url: https://attack.mitre.org/techniques/T1562/004/
entities:
  - { key: device, label: Network device, example: "FW-EDGE-01" }
  - { key: admin, label: Admin account, example: "netadmin" }
  - { key: ip, label: Admin source IP, example: "10.1.1.25" }
start: c-change
nodes:
  c-change:
    type: check
    text: Pull the admin session and the configuration changes.
    also_check:
      - "Did {{ip}} make failed logons to {{device}} or other network devices before the session?"
      - "Has {{admin}} logged on to other network devices it does not normally manage?"
    kql:
      - title: Admin logons and config events on the device (7d)
        platform: sentinel
        query: |
          CommonSecurityLog
          | where TimeGenerated > ago(7d)
          | where DeviceName =~ "{{device}}" or Computer =~ "{{device}}"
          | where Activity has_any ("admin", "login", "config", "policy", "commit", "user", "log")
          | project TimeGenerated, DeviceVendor, Activity, SourceIP, SourceUserName, DeviceAction, Message
          | order by TimeGenerated asc
    note: I pulled the admin session by {{admin}} from {{ip}} on {{device}} and the changes made.
    next: q-ticket

  q-ticket:
    type: question
    text: Is there a change ticket matching the time and the change?
    yes: q-source
    no: q-impact
    notes:
      yes: The change on {{device}} matches a change ticket.
      no: No change ticket covers the change on {{device}}.

  q-source:
    type: question
    text: Did the admin connect from the management network or jump host, with their named account?
    yes: q-no-mfa
    no: q-impact
    notes:
      yes: "{{admin}} connected from the management network with a named account."
      no: "{{admin}} connected from {{ip}}, outside the management network, or with a shared account."

  q-no-mfa:
    type: question
    text: Did {{admin}} authenticate without MFA where MFA is required?
    why: A yes means the session bypassed a required control, so the ticket alone does not prove the admin made the change.
    yes: o-account-doubt
    no: q-account-changed
    notes:
      yes: I found that {{admin}} authenticated to {{device}} without MFA where MFA is required.
      no: I found that {{admin}} completed MFA as required.

  q-account-changed:
    type: question
    text: Has {{admin}} recently been given higher privileges or had its password changed unexpectedly?
    why: A yes suggests the account was taken over before the change, even though a ticket exists.
    yes: o-account-doubt
    no: o-benign
    notes:
      yes: I found an unexpected privilege or password change on {{admin}} before the session.
      no: I found no unexpected privilege or password changes on {{admin}}.

  q-impact:
    type: question
    text: Does the change open inbound access, add admin accounts, weaken VPN or disable logging?
    also_check:
      - "Did the change alter DNS, routing, NAT or proxy settings in a way that could redirect traffic?"
      - "Did the session export the configuration or access stored credentials or key material on {{device}}?"
    yes: o-tp
    no: o-inconclusive
    notes:
      yes: The change opens access, adds accounts or reduces logging.
      no: The change does not weaken security.

  o-benign:
    type: outcome
    verdict: benign_positive
    title: Approved network change
    anchor: "{{admin}} changed {{device}} under a change ticket from the management network."
    risk: The risk here is an attacker opening access through network devices; it doesn't apply given the ticket and source.
    actions:
      - Close referencing the ticket

  o-account-doubt:
    type: outcome
    verdict: inconclusive
    title: Ticketed change from a doubtful admin account
    anchor: "{{admin}} changed {{device}} under a change ticket, but the account shows signs of misuse around the session."
    risk: The risk here is an attacker using a taken-over admin account inside a legitimate change window, which stays open until the account owner confirms the session.
    actions:
      - Ask the owner of {{admin}} and the network team to confirm they made the change from {{ip}}
      - Compare the change on {{device}} with the ticket line by line
      - Review how {{admin}} authenticated and any recent password or privilege changes
      - Escalate to a senior analyst, and reset the account if the owner does not confirm
    monitor: I will monitor {{admin}} for logons to network devices and {{device}} for further changes.

  o-inconclusive:
    type: outcome
    verdict: inconclusive
    title: Unticketed low-impact change
    anchor: "{{admin}} changed {{device}} without a ticket, but the change does not weaken security."
    risk: The risk here is uncontrolled change on a critical device, which stays open until the network team confirms it.
    actions:
      - Ask the network team to confirm and retro-ticket the change
    monitor: I will monitor {{device}} for further unticketed changes.

  o-tp:
    type: outcome
    verdict: true_positive
    title: Unauthorised security-weakening change
    anchor: "{{device}} was changed to open access, add accounts or reduce logging without authorisation."
    risk: The risk here is attacker-controlled network access and blind spots; containment is required now.
    actions:
      - Revert the change and remove rogue accounts
      - Rotate device admin credentials and check firmware for known CVEs
      - Review traffic through any opened rule
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor {{device}} for admin logons and configuration changes.
