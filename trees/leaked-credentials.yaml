id: leaked-credentials
title: Leaked Credentials
category: identity
summary: >-
  A user's username and password were found in a breach dump, paste or infostealer log.
  The question is whether the leaked password is still valid and whether anyone has used
  it. Infostealer leaks also mean the user's device may be infected.
applies_to:
  - Leaked credentials (Entra ID Protection)
  - Credentials found in infostealer logs (threat intel)
  - Dark web credential exposure
mitre: [T1589.001, T1078]
version: 1.0.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: Microsoft Entra ID Protection risk detections (leakedCredentials)
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
  - title: "MITRE ATT&CK T1589.001 Gather Victim Identity Information: Credentials"
    url: https://attack.mitre.org/techniques/T1589/001/
entities:
  - { key: user, label: User principal name, example: "jdoe@contoso.com" }
start: c-leak
nodes:
  c-leak:
    type: check
    text: Establish what leaked and from where.
    look_for:
      - Source (breach dump, paste site, infostealer log) and leak date
      - Whether the leak includes session cookies or only a password
      - The machine name or user profile in an infostealer log, if given
    note: I reviewed the leak record for {{user}}, including its source and date.
    next: q-password-changed

  q-password-changed:
    type: question
    text: Has the password been changed since the leak date?
    why: Entra only raises this for hashes matching the current password when password hash sync is on, but third-party feeds do not check. Compare the leak date to the last password change.
    kql:
      - title: Password changes and resets for the user (180d)
        platform: sentinel
        query: |
          AuditLogs
          | where TimeGenerated > ago(180d)
          | where OperationName has_any ("Change user password", "Reset user password", "Reset password", "Change password")
          | where tostring(TargetResources[0].userPrincipalName) =~ "{{user}}"
          | project TimeGenerated, OperationName, Result, Actor = tostring(InitiatedBy.user.userPrincipalName)
    yes: q-used
    no: q-used
    notes:
      yes: The password for {{user}} was changed after the leak date.
      no: The password for {{user}} has not been changed since the leak date.

  q-used:
    type: question
    text: Is there evidence the leaked credentials were used (sign-ins from unfamiliar IPs, failed attempts with the right password, MFA prompts the user did not start)?
    kql:
      - title: Sign-in sources for the user (30d)
        platform: sentinel
        query: |
          SigninLogs
          | where TimeGenerated > ago(30d)
          | where UserPrincipalName =~ "{{user}}"
          | summarize Attempts = count(), Success = countif(ResultType == "0"), Codes = make_set(ResultType),
                      First = min(TimeGenerated), Last = max(TimeGenerated)
                    by IPAddress, AutonomousSystemNumber, Country = tostring(LocationDetails.countryOrRegion)
          | order by First desc
    yes: l-signin
    no: q-infostealer
    notes:
      yes: I found sign-in activity for {{user}} from unfamiliar sources consistent with use of the leaked credentials.
      no: I found no use of the credentials from unfamiliar sources.

  l-signin:
    type: link
    text: The credentials were used. Continue with the sign-in checks.
    tree: atypical-signin
    node: q-post-auth
    note: I moved to post-authentication checks for the sign-ins that used the leaked credentials.

  q-infostealer:
    type: question
    text: Did the leak come from an infostealer log (which means a device, possibly personal, was infected)?
    yes: o-tp-infostealer
    no: o-benign-rotated
    notes:
      yes: The leak came from an infostealer log, which means a device used by {{user}} was infected.
      no: The leak came from a third-party breach dump, not an infection.

  o-benign-rotated:
    type: outcome
    verdict: benign_positive
    title: Old breach, no use
    anchor: The credentials for {{user}} appeared in a third-party breach and I found no use of them against the tenant.
    risk: The risk here is account takeover through the leaked password; it doesn't apply once the password is rotated, and MFA covers the account.
    actions:
      - Reset the password if it has not changed since the leak
      - Confirm the user as safe or dismiss the risk in Entra ID Protection after the reset
      - Remind the user not to reuse work passwords

  o-tp-infostealer:
    type: outcome
    verdict: true_positive
    title: Credentials stolen by an infostealer
    anchor: The credentials for {{user}} were stolen by infostealer malware on a device they use.
    risk: The risk here is session cookie theft and account takeover, plus an infected device that may keep leaking new credentials; the password reset alone is not enough.
    actions:
      - Reset the password and revoke sessions and refresh tokens
      - Identify the infected device from the log and run the infostealer tree on it
      - If the device is personal, advise the user to clean it before any further work access
      - Check the log for other corporate credentials or SaaS accounts
    escalate: true
    monitor: I will monitor {{user}} for sign-ins from unfamiliar infrastructure over the next 14 days.
