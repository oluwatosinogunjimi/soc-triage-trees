id: service-principal-credential-added
title: Credential Added to App or Service Principal
category: identity
summary: >-
  A new client secret or certificate was added to an application or service principal.
  If the app holds strong Graph permissions, whoever holds the new secret can act as the
  app without any user or MFA. Check who added it and whether the app then signed in
  from somewhere new.
applies_to:
  - Unusual addition of credentials to an OAuth app
  - Suspicious service principal sign-in following credential addition
  - Update application - Certificates and secrets management
  - Possible service principal account secret leak
mitre: [T1098.001, T1550.001]
version: 1.2.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: Microsoft incident response playbook, Compromised and malicious applications
    url: https://learn.microsoft.com/en-us/security/operations/incident-response-playbook-compromised-malicious-app
  - title: "MITRE ATT&CK T1098.001 Additional Cloud Credentials"
    url: https://attack.mitre.org/techniques/T1098/001/
entities:
  - { key: app, label: Application name, example: "HR-Sync-Prod" }
  - { key: app_id, label: Application (client) ID, example: "00001111-aaaa-2222-bbbb-3333cccc4444" }
  - { key: actor, label: Who added the credential, example: "dev-admin@contoso.com" }
start: c-credential
nodes:
  c-credential:
    type: check
    text: Pull the credential change and the app's permissions.
    look_for:
      - Credential type (secret or certificate), expiry and key ID
      - Actor and actor IP, portal or Graph or PowerShell
      - The app's application permissions (Mail.ReadWrite, Directory.ReadWrite.All, RoleManagement...)
    also_check:
      - "Has {{actor}} added credentials to or changed other applications or service principals?"
    kql:
      - title: Credential changes on the app (30d)
        platform: sentinel
        query: |
          AuditLogs
          | where TimeGenerated > ago(30d)
          | where OperationName has_any ("Certificates and secrets management", "Add service principal credentials",
                                         "Update application", "Update service principal")
          | where tostring(TargetResources[0].displayName) =~ "{{app}}" or tostring(TargetResources[0].id) == "{{app_id}}"
          | project TimeGenerated, OperationName, Result,
                    Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName)),
                    ActorIP = tostring(InitiatedBy.user.ipAddress), TargetResources
    note: I pulled the credential added to {{app}} ({{app_id}}) by {{actor}}.
    next: q-routine

  q-routine:
    type: question
    text: Is this a routine rotation by the app's owner or pipeline (matches the rotation schedule, owner confirms)?
    yes: q-sp-signins
    no: q-high-privilege
    notes:
      yes: The credential was added as a routine rotation by the app owner.
      no: The credential addition is not a routine rotation.

  q-high-privilege:
    type: question
    text: Does the app hold high-impact application permissions (mail, files, directory or role write)?
    also_check:
      - "Were new application permissions granted or admin-consented for {{app}} around the time of the credential change?"
    yes: q-sp-signins
    no: q-sp-signins
    notes:
      yes: "{{app}} holds high-impact application permissions."
      no: "{{app}} holds only low-impact permissions."

  q-sp-signins:
    type: question
    text: Has the service principal signed in from a new IP, ASN or country since the credential was added?
    also_check:
      - "Has {{app}} accessed mail, files or directory data at unusual volume since the credential was added?"
      - "Has {{app}} made role assignments, created users or changed other applications since the credential was added?"
      - "Has {{app}} enumerated users, groups or roles in bulk through Graph?"
    kql:
      - title: Service principal sign-ins (30d)
        platform: sentinel
        query: |
          AADServicePrincipalSignInLogs
          | where TimeGenerated > ago(30d)
          | where AppId == "{{app_id}}"
          | summarize SignIns = count(), First = min(TimeGenerated), Last = max(TimeGenerated), Resources = make_set(ResourceDisplayName, 10)
                    by IPAddress, Location
          | order by First desc
    yes: o-tp-used
    no: q-actor-clean
    notes:
      yes: "{{app}} signed in from new infrastructure after the credential was added."
      no: "{{app}} has signed in only from its usual infrastructure."

  q-actor-clean:
    type: question
    text: Was the actor's session clean and does the app owner confirm the change?
    also_check:
      - "Has {{actor}} recently been given a privileged role such as Application Administrator unexpectedly?"
      - "Has {{actor}} changed diagnostic settings, audit logging or Conditional Access policies?"
    yes: q-secret-exposed
    no: o-tp-unused
    unknown: o-inconclusive
    notes:
      yes: The app owner confirmed the change and the session of {{actor}} was clean.
      no: The change was not made by the app owner, or the session of {{actor}} was risky.
      unknown: I could not confirm the change with the app owner.

  q-secret-exposed:
    type: question
    text: "Has a secret for {{app}} been exposed in logs, scripts or code repositories?"
    why: An exposed secret gives anyone who found it app-only access, so a routine rotation cannot close the case while it is live.
    yes: l-secret-exposed-repo
    no: q-actor-mfa
    notes:
      yes: "I found a secret for {{app}} exposed in logs, scripts or code repositories."
      no: "I found no secret for {{app}} exposed in logs, scripts or code repositories."

  q-actor-mfa:
    type: question
    text: "Has {{actor}} registered or changed an MFA method from an unrecognised IP?"
    why: A new MFA method on the actor from an unknown IP means the account that added the credential is likely compromised, whatever the owner says.
    yes: o-tp-unused
    no: o-benign
    notes:
      yes: "I found an MFA method registered or changed for {{actor}} from an unrecognised IP."
      no: "I found no MFA method registered or changed for {{actor}} from an unrecognised IP."

  l-secret-exposed-repo:
    type: link
    text: Continue in Secret Exposed in a Code Repository.
    tree: secret-exposed-repo

  o-benign:
    type: outcome
    verdict: benign_positive
    title: Routine credential rotation
    anchor: The credential on {{app}} was added by its owner as part of normal rotation, and the app signs in only from its usual infrastructure.
    risk: The risk here is an attacker minting their own secret for a privileged app; it doesn't apply given the owner confirmation and unchanged sign-in pattern.
    actions:
      - Close
      - Recommend certificate credentials and workload identity Conditional Access for privileged apps

  o-inconclusive:
    type: outcome
    verdict: inconclusive
    title: Unconfirmed credential addition
    anchor: A credential was added to {{app}} by {{actor}} and the owner has not yet confirmed it.
    risk: The risk here is app-only access with the new secret, which stays open until the owner confirms or the credential is removed.
    actions:
      - Chase the app owner
      - Remove the new credential if the app holds high-impact permissions and confirmation is slow
    monitor: I will monitor {{app}} for sign-ins from new infrastructure.

  o-tp-unused:
    type: outcome
    verdict: true_positive
    title: Rogue credential, not yet used
    anchor: A credential was added to {{app}} without the owner's knowledge, and the app has not yet signed in from new infrastructure.
    risk: The risk here is app-only access to tenant data with no user or MFA involved; removing the credential closes it before use.
    actions:
      - Remove the rogue credential
      - Revoke sessions for {{actor}} and investigate the compromise
      - Review other apps the actor modified
    escalate: true
    monitor: I will monitor {{app}} for sign-ins and further credential changes.

  o-tp-used:
    type: outcome
    verdict: true_positive
    title: Rogue credential used
    anchor: "{{app}} signed in from new infrastructure after a credential was added to it."
    risk: The risk here is data theft and persistence through app-only access, which a user password reset does not stop.
    actions:
      - Remove all credentials added in the window and rotate the rest
      - Disable the service principal if its use cannot be contained quickly
      - Scope what the app accessed using its permissions and sign-in resources
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor {{app}} and the new infrastructure for further activity.
