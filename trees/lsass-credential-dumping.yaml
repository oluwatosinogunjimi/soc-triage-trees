id: lsass-credential-dumping
title: LSASS Credential Dumping
category: endpoint
summary: >-
  A process read LSASS memory or created a dump of it (procdump, comsvcs.dll MiniDump,
  Task Manager, custom tools). Every credential cached on that host must be treated as
  stolen, so find out whose credentials were there.
applies_to:
  - Suspicious access to LSASS service
  - LSASS process memory dump
  - Credential dumping using comsvcs.dll
  - Mimikatz credential theft tool
mitre: [T1003.001]
version: 1.0.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: "MITRE ATT&CK T1003.001 OS Credential Dumping: LSASS Memory"
    url: https://attack.mitre.org/techniques/T1003/001/
  - title: Microsoft, detecting and preventing LSASS credential dumping
    url: https://www.microsoft.com/en-us/security/blog/2022/10/05/detecting-and-preventing-lsass-credential-dumping-attacks/
entities:
  - { key: device, label: Device name, example: "SRV-APP02" }
  - { key: account, label: Account that accessed LSASS, example: "adm-jdoe" }
start: c-access
nodes:
  c-access:
    type: check
    text: Identify the process that touched LSASS and how.
    kql:
      - title: LSASS access and dump commands (24h)
        platform: xdr
        query: |
          union
            (DeviceEvents | where ActionType in ("OpenProcessApiCall", "ReadProcessMemoryApiCall") and FileName =~ "lsass.exe"
               | project Timestamp, DeviceName, Kind = ActionType, Process = InitiatingProcessFileName, Cmd = InitiatingProcessCommandLine, Account = InitiatingProcessAccountName),
            (DeviceProcessEvents | where ProcessCommandLine has_any ("lsass", "comsvcs.dll", "MiniDump", "sekurlsa", "procdump")
               | project Timestamp, DeviceName, Kind = "Process", Process = FileName, Cmd = ProcessCommandLine, Account = AccountName),
            (DeviceFileEvents | where FileName endswith ".dmp" and FileName has "lsass"
               | project Timestamp, DeviceName, Kind = "DumpFile", Process = InitiatingProcessFileName, Cmd = FolderPath, Account = InitiatingProcessAccountName)
          | where Timestamp > ago(24h)
          | where DeviceName =~ "{{device}}"
          | order by Timestamp asc
    note: I identified the process that accessed LSASS on {{device}} under {{account}}.
    next: q-legit

  q-legit:
    type: question
    text: Is it a legitimate security or support tool (EDR, AV, WER crash dump, a vendor debugging session with a ticket)?
    yes: o-fp
    no: q-blocked
    notes:
      yes: The LSASS access came from a legitimate security or support tool.
      no: No legitimate tool explains the LSASS access.

  q-blocked:
    type: question
    text: Did ASR, Credential Guard or the EDR block the read, and was no dump file written?
    yes: o-tp-blocked
    no: q-privileged
    notes:
      yes: The LSASS read on {{device}} was blocked and no dump was written.
      no: The LSASS read succeeded or a dump file was written on {{device}}.

  q-privileged:
    type: question
    text: Were privileged accounts (domain admins, service accounts) logged on to {{device}} recently?
    kql:
      - title: Accounts logged on to the device (7d)
        platform: xdr
        query: |
          DeviceLogonEvents
          | where Timestamp > ago(7d)
          | where DeviceName =~ "{{device}}" and ActionType == "LogonSuccess"
          | summarize Logons = count(), Last = max(Timestamp) by AccountDomain, AccountName, LogonType
    yes: o-tp-priv
    no: o-tp
    notes:
      yes: Privileged accounts had cached credentials on {{device}}.
      no: Only standard accounts had cached credentials on {{device}}.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Legitimate LSASS access
    anchor: The LSASS access on {{device}} came from a legitimate security or support tool.
    risk: The risk here is theft of cached credentials; it doesn't apply given the tool and context.
    actions:
      - Close
    tuning: Exclude the specific signed tool path, never a whole folder.

  o-tp-blocked:
    type: outcome
    verdict: true_positive
    title: Credential dumping blocked
    anchor: An attempt to dump LSASS on {{device}} by {{account}} was blocked.
    risk: The risk here is theft of cached credentials; it doesn't apply to this attempt, but an attacker is on the host.
    actions:
      - Isolate {{device}} and find how the attacker got there
      - Reset {{account}}
      - Raise an incident
    escalate: true
    monitor: I will monitor {{device}} and {{account}} for further credential access attempts.

  o-tp:
    type: outcome
    verdict: true_positive
    title: Credentials dumped, standard accounts
    anchor: LSASS memory on {{device}} was dumped by {{account}}.
    risk: The risk here is reuse of every credential cached on {{device}} for lateral movement; containment is required now.
    actions:
      - Isolate {{device}}
      - Reset every account that logged on to the device recently
      - Hunt for pass-the-hash use of those accounts
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor the exposed accounts for logons from unusual hosts.

  o-tp-priv:
    type: outcome
    verdict: true_positive
    title: Credentials dumped, privileged accounts exposed
    anchor: LSASS memory on {{device}} was dumped while privileged credentials were cached there.
    risk: The risk here is domain compromise with the stolen privileged credentials; this is a P1.
    actions:
      - Isolate {{device}} and call the customer on the P1 path
      - Reset exposed privileged accounts immediately (twice for Kerberos-heavy accounts)
      - Hunt for use of those accounts across the estate
      - Engage incident response
    escalate: true
    monitor: I will monitor the exposed privileged accounts for any logon outside their baseline.
