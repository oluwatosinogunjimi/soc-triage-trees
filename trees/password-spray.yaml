id: password-spray
title: Password Spray or Brute Force
category: identity
summary: >-
  Many failed sign-ins from one source. Confirm the pattern, then find the accounts where
  the password was accepted. Those are the ones that matter, whether MFA stopped the
  attacker or not.
applies_to:
  - Password spray
  - Brute force attack against Entra ID
  - Multiple failed sign-ins from a single IP
  - Suspected brute force attack (MDI)
mitre: [T1110.003, T1110.001, T1110.004]
version: 1.1.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: Microsoft incident response playbook, Password spray investigation
    url: https://learn.microsoft.com/en-us/security/operations/incident-response-playbook-password-spray
  - title: Microsoft Entra sign-in error codes reference
    url: https://login.microsoftonline.com/error
  - title: "MITRE ATT&CK T1110.003 Password Spraying"
    url: https://attack.mitre.org/techniques/T1110/003/
entities:
  - { key: ip, label: Source IP address, example: "103.152.18.7" }
  - { key: user, label: Most-targeted user (if known), example: "jdoe@contoso.com" }
start: c-scope
nodes:
  c-scope:
    type: check
    text: Characterise the activity from the source.
    look_for:
      - Number of attempts and number of distinct accounts targeted
      - Time spread and regularity (automated sprays have regular intervals)
      - Result codes (50126 bad password, 50053 smart lockout, 0 success)
      - Applications, client apps (legacy protocols) and user agents
      - Other IPs in the same ASN doing the same thing
    also_check:
      - "Does {{ip}} appear in historical logs of unauthorised access or earlier incidents in the tenant?"
    kql:
      - title: Activity from the source IP (24h)
        platform: sentinel
        query: |
          SigninLogs
          | where TimeGenerated > ago(24h)
          | where IPAddress == "{{ip}}"
          | summarize Attempts = count(), TargetedUsers = dcount(UserPrincipalName),
                      Successes = countif(ResultType == "0"), First = min(TimeGenerated), Last = max(TimeGenerated),
                      Codes = make_set(ResultType), Apps = make_set(AppDisplayName, 10),
                      ClientApps = make_set(ClientAppUsed, 10), UAs = make_set(UserAgent, 5)
                    by IPAddress, AutonomousSystemNumber
      - title: Other IPs in the same ASN failing sign-ins (24h)
        platform: sentinel
        query: |
          let asn = toscalar(SigninLogs | where TimeGenerated > ago(24h) | where IPAddress == "{{ip}}" | take 1 | project AutonomousSystemNumber);
          SigninLogs
          | where TimeGenerated > ago(24h)
          | where AutonomousSystemNumber == asn and ResultType in ("50126", "50053")
          | summarize Attempts = count(), Users = dcount(UserPrincipalName) by IPAddress
          | order by Attempts desc
      - title: On-premises attempts via Defender for Identity (24h)
        platform: xdr
        query: |
          IdentityLogonEvents
          | where Timestamp > ago(24h)
          | where IPAddress == "{{ip}}"
          | summarize Attempts = count(), Users = dcount(AccountUpn),
                      Failed = countif(ActionType == "LogonFailed"), Success = countif(ActionType == "LogonSuccess")
                    by Application, Protocol
    note: I characterised the sign-in activity from {{ip}} across the tenant.
    next: q-pattern

  q-pattern:
    type: question
    text: Is this a spray (many accounts, few attempts each) or brute force (many attempts on one account) from an untrusted source?
    why: >-
      A single user failing repeatedly from a known device is usually a stale password on a
      phone or mapped drive, not an attack. Check the device and baseline before calling it.
    also_check:
      - "Is {{ip}} flagged in threat intelligence for malicious activity?"
      - "Did {{ip}} target privileged or admin accounts?"
    yes: q-any-accepted
    no: o-fp-stale-credentials
    notes:
      yes: "{{ip}} made repeated failed attempts consistent with password spray or brute force."
      no: The failures come from a known device of {{user}} and match a stale saved credential.

  q-any-accepted:
    type: question
    text: For any targeted account, was the password accepted (ResultType 0, or 50074, 50076, 500121, 53003 which all follow a correct password)?
    why: These are the accounts to act on. Prioritise successful sign-ins first, then password-accepted interrupts, then plain failures.
    also_check:
      - "Do the accounts with an accepted password appear in a recent credential leak or infostealer log?"
    kql:
      - title: Accounts where the password was accepted (7d)
        platform: sentinel
        query: |
          SigninLogs
          | where TimeGenerated > ago(7d)
          | where IPAddress == "{{ip}}"
          | where ResultType in ("0", "50074", "50076", "500121", "53003", "50158")
          | summarize Count = count(), Codes = make_set(ResultType), First = min(TimeGenerated) by UserPrincipalName
    yes: q-mfa-held
    no: q-legacy
    notes:
      yes: The password was accepted for at least one targeted account, including {{user}}.
      no: No targeted account had its password accepted; every attempt failed at the password stage.

  q-legacy:
    type: question
    text: Were the attempts made over legacy authentication or against an app excluded from MFA?
    why: Legacy protocols cannot do MFA. If they are still allowed, a successful guess would go straight in, so this is a control gap to report even when nothing succeeded.
    kql:
      - title: Attempts by client app (24h)
        platform: sentinel
        query: |
          SigninLogs
          | where TimeGenerated > ago(24h)
          | where IPAddress == "{{ip}}"
          | summarize Attempts = count() by ClientAppUsed, AppDisplayName, ConditionalAccessStatus
    yes: o-attempt-legacy-gap
    no: o-attempt-failed
    notes:
      yes: The attempts used legacy authentication or targeted an app outside MFA coverage.
      no: The attempts used modern authentication against MFA-protected applications.

  q-mfa-held:
    type: question
    text: For the accounts with an accepted password, did MFA or Conditional Access stop every attempt (no ResultType 0)?
    also_check:
      - "Has any account with an accepted password registered a new MFA method from an unrecognised IP?"
    yes: o-password-compromised
    no: l-post-auth
    notes:
      yes: MFA or Conditional Access blocked every attempt where the password was accepted.
      no: At least one attempt from {{ip}} resulted in a fully successful sign-in.

  l-post-auth:
    type: link
    text: A sign-in succeeded. Check what the attacker did next in the sign-in tree.
    tree: atypical-signin
    node: q-post-auth
    note: I moved to post-authentication checks for the account that was accessed.

  o-fp-stale-credentials:
    type: outcome
    verdict: false_positive
    title: Stale saved credentials
    anchor: The failed sign-ins come from a known device of {{user}} using an outdated saved password.
    risk: The risk here is password guessing against {{user}}; it doesn't apply as the source is the user's own device and baseline.
    actions: [Ask the user to update the saved password on the device]

  o-attempt-failed:
    type: outcome
    verdict: true_positive
    title: Spray attempt, no password accepted
    anchor: "{{ip}} sprayed passwords against multiple accounts, and every attempt failed at the password stage."
    risk: The risk here is account takeover through a guessed password; it doesn't apply as no account accepted a password and MFA covers the targeted apps.
    actions: ["Block {{ip}} in Conditional Access or at the perimeter", Tag the IP for future alerting]
    monitor: I will monitor the targeted accounts for sign-ins from {{ip}} or its ASN.

  o-attempt-legacy-gap:
    type: outcome
    verdict: true_positive
    title: Spray attempt over legacy authentication
    anchor: "{{ip}} sprayed passwords over legacy authentication; no password was accepted."
    risk: The risk here is a guessed password bypassing MFA through legacy protocols, which remains open while legacy authentication is allowed.
    actions:
      - Block {{ip}}
      - Recommend blocking legacy authentication through Conditional Access
    monitor: I will monitor for further legacy authentication attempts against the targeted accounts.

  o-password-compromised:
    type: outcome
    verdict: true_positive
    title: Passwords guessed, MFA held
    anchor: "{{ip}} guessed valid passwords for at least one account, including {{user}}, but MFA or Conditional Access blocked access."
    risk: The risk here is account takeover through MFA fatigue or a weaker path; it has not happened, but the guessed passwords are compromised.
    actions:
      - Reset passwords for every account with an accepted password
      - Ask those users whether they saw or approved unexpected MFA prompts
      - Block {{ip}} and tag it for future alerting
      - Recommend banned-password lists (Entra Password Protection)
    monitor: I will monitor the affected accounts for MFA fatigue patterns and new sign-ins from unfamiliar infrastructure.
