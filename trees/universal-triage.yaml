      - { label: "Identity: Entra ID and Active Directory (29)", next: ch-identity }
      - { label: "Endpoint: Windows, Linux and servers (24)", next: ch-endpoint }
      - { label: "Network, perimeter and OT (13)", next: ch-network }
      - { label: "Cloud and SaaS: Azure, AWS and M365 data (18)", next: ch-cloud }
      - { label: "None of these: use the generic flow", next: q-obviously-benign }

