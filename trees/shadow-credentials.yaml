id: shadow-credentials
title: Shadow Credentials or RBCD Attribute Change
category: identity
summary: >-
  Someone wrote to msDS-KeyCredentialLink (shadow credentials) or
  msDS-AllowedToActOnBehalfOfOtherIdentity (resource-based constrained delegation) on a
  user or computer. Both let an attacker authenticate as that object without its password.
  Windows Hello and some device-registration flows write the first attribute legitimately.
applies_to:
  - Shadow credentials added to account
  - Shadow Credentials Added to Account and Used for Authentication
  - Suspicious resource-based constrained delegation (RBCD) attribute change
  - Directory object modified, msDS-KeyCredentialLink (Event 5136)
mitre: [T1556, T1134.001]
version: 1.1.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: Microsoft Defender for Identity XDR alerts (persistence)
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-xdr
  - title: "MITRE ATT&CK T1556 Modify Authentication Process"
    url: https://attack.mitre.org/techniques/T1556/
entities:
  - { key: target, label: Object modified, example: "SRV-SQL01$" }
  - { key: account, label: Account that made the change, example: "jdoe" }
start: c-change
nodes:
  c-change:
    type: check
    text: Pull the attribute change and who made it.
    kql:
      - title: Directory attribute changes (Event 5136, 7d)
        platform: sentinel
        query: |
          SecurityEvent
          | where TimeGenerated > ago(7d)
          | where EventID == 5136
          | where EventData has_any ("msDS-KeyCredentialLink", "msDS-AllowedToActOnBehalfOfOtherIdentity")
          | project TimeGenerated, Computer, SubjectUserName, EventData
    note: I pulled the change to {{target}} made by {{account}}.
    next: q-whfb

  q-whfb:
    type: question
    text: Is it a KeyCredentialLink write by the object itself or the Entra Connect/device registration service, matching a Windows Hello for Business enrolment?
    yes: o-fp
    no: q-approved
    notes:
      yes: The change matches a Windows Hello for Business or device registration flow.
      no: The change was made by {{account}}, which is not part of any enrolment flow.

  q-approved:
    type: question
    text: Is it an approved admin change (documented delegation setup) or authorised test?
    also_check:
      - "Has {{account}} changed permissions, ACLs or group memberships to grant itself or others more privilege?"
      - "Has {{account}} changed credentials or authentication attributes on other users or computers?"
      - "Has {{account}} run reconnaissance such as BloodHound, net group or other AD enumeration?"
      - "Has {{account}} signed in from a new device or an unrecognised location?"
      - "Has {{account}} cleared security logs or changed audit settings?"
    yes: o-benign
    no: q-used
    notes:
      yes: The change to {{target}} was an approved administrative action.
      no: No approval covers the change to {{target}}.

  q-used:
    type: question
    text: Was the new credential or delegation used to authenticate as {{target}}?
    also_check:
      - "Has {{target}} attempted credential dumping or DCSync-style directory replication?"
      - "Has {{target}} logged on to hosts it does not normally use?"
    yes: o-tp-used
    no: o-tp
    notes:
      yes: The new credential or delegation was used to authenticate as {{target}}.
      no: The new credential or delegation has not yet been used.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Windows Hello or device registration
    anchor: The key credential write on {{target}} came from a Windows Hello for Business or device registration flow.
    risk: The risk here is authentication as {{target}} without its password; it doesn't apply as the write came from the legitimate enrolment service.
    actions:
      - Close
    tuning: Exclude writes by the object itself and the registration service account.

  o-benign:
    type: outcome
    verdict: benign_positive
    title: Approved delegation change
    anchor: The change to {{target}} by {{account}} was an approved administrative action.
    risk: The risk here is impersonation through delegation; the configuration is intended, so it should be documented and reviewed.
    actions:
      - Close referencing the change

  o-tp:
    type: outcome
    verdict: true_positive
    title: Rogue credential or delegation, not yet used
    anchor: "{{account}} added a rogue key credential or delegation to {{target}}, which has not yet been used."
    risk: The risk here is authentication as {{target}} without its password; removing the attribute closes it before use.
    actions:
      - Remove the rogue attribute value
      - Reset {{account}} and investigate how it gained write rights
      - Review ACLs that allowed the write
    escalate: true
    monitor: I will monitor for authentication as {{target}} using certificates or delegation.

  o-tp-used:
    type: outcome
    verdict: true_positive
    title: Rogue credential used for impersonation
    anchor: "{{account}} added a rogue key credential or delegation to {{target}} and used it to authenticate."
    risk: The risk here is privilege escalation through impersonation of {{target}}; containment is required now.
    actions:
      - Remove the rogue attribute value and reset {{target}} (machine or user)
      - Reset {{account}} and isolate the host that used the credential
      - Review what was accessed as {{target}}
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor for further attribute writes and impersonation attempts.
