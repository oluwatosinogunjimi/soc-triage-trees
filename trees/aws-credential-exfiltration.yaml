id: aws-credential-exfiltration
title: AWS Credentials Used Outside Their Workload
category: cloud
summary: >-
  Temporary credentials from an EC2 instance role (or a Lambda or ECS task) were used from
  outside that workload, often after SSRF against the metadata service. Or an IAM user's
  access key is being used from somewhere new. The key is live until revoked.
applies_to:
  - UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS
  - UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS
  - CredentialAccess:IAMUser/CompromisedCredentials
  - UnauthorizedAccess:IAMUser/MaliciousIPCaller
mitre: [T1552.005, T1078.004]
version: 1.2.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: AWS GuardDuty finding types (IAM)
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-active.html
  - title: "MITRE ATT&CK T1552.005 Cloud Instance Metadata API"
    url: https://attack.mitre.org/techniques/T1552/005/
entities:
  - { key: access_key, label: Access key ID, example: "ASIAEXAMPLE1234567" }
  - { key: ip, label: Source IP of the misuse, example: "5.188.62.140" }
start: c-usage
nodes:
  c-usage:
    type: check
    text: Map every call made with the key and where from.
    also_check:
      - "Does the role or key behind {{access_key}} hold admin rights or access to sensitive data?"
    kql:
      - title: Calls made with the key (7d)
        platform: sentinel
        query: |
          AWSCloudTrail
          | where TimeGenerated > ago(7d)
          | where UserIdentityAccessKeyId == "{{access_key}}"
          | summarize Calls = count(), Events = make_set(EventName, 50), Errors = countif(isnotempty(ErrorCode)),
                      First = min(TimeGenerated), Last = max(TimeGenerated) by SourceIpAddress, UserAgent, UserIdentityArn
          | order by First asc
    note: I mapped every call made with key {{access_key}}, including from {{ip}}.
    next: q-expected

  q-expected:
    type: question
    text: Is {{ip}} an expected source for this key (the workload's own IP or NAT, a VPC endpoint, the CI system)?
    also_check:
      - "Is {{ip}} flagged in threat intelligence or hosted on a VPS, VPN or anonymising provider?"
      - "Has {{ip}} made calls with any other access key, role or AWS account?"
    yes: q-logging
    no: q-actions
    notes:
      yes: "{{ip}} is an expected source for key {{access_key}}."
      no: "{{ip}} is not an expected source for key {{access_key}}."

  q-logging:
    type: question
    text: Did {{access_key}} stop, delete or change CloudTrail, GuardDuty or other logging?
    why: A yes means the key was used to blind monitoring, which an expected source does not explain.
    yes: l-cloud-logging-disabled
    no: o-fp
    notes:
      yes: I found that key {{access_key}} was used to stop, delete or change CloudTrail, GuardDuty or other logging.
      no: I found no changes to CloudTrail, GuardDuty or other logging made with key {{access_key}}.

  l-cloud-logging-disabled:
    type: link
    text: Continue in Cloud Logging or Monitoring Disabled
    tree: cloud-logging-disabled

  q-actions:
    type: question
    text: Did the external use go beyond discovery (reading data, creating keys or users, launching resources, changing policies)?
    also_check:
      - "Did {{access_key}} assume a more privileged role or a role in another AWS account?"
      - "Did {{access_key}} read secrets or passwords (GetSecretValue, GetPasswordData, SSM parameters)?"
      - "Did {{access_key}} make buckets, snapshots or AMIs public or share them with another account?"
    yes: o-tp-active
    no: o-tp-recon
    notes:
      yes: The misuse from {{ip}} went beyond discovery into data access or changes.
      no: The misuse from {{ip}} was limited to discovery calls.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Expected source
    anchor: Key {{access_key}} was used from {{ip}}, which is an expected source for its workload.
    risk: The risk here is stolen cloud credentials; it doesn't apply as the source belongs to the workload.
    actions:
      - Close
    tuning: Add the workload's egress IPs as trusted for this finding.

  o-tp-recon:
    type: outcome
    verdict: true_positive
    title: Stolen credentials used for discovery
    anchor: Key {{access_key}} was used from {{ip}} outside its workload for discovery calls.
    risk: The risk here is escalation to data theft or resource abuse with the stolen key; revoking it now stops that.
    actions:
      - Revoke the role's active sessions (or deactivate the IAM user key)
      - Find how it leaked (SSRF to IMDS, exposed .env, CI logs) and fix it; enforce IMDSv2
      - Block {{ip}}
    escalate: true
    monitor: I will monitor for any further use of the role or key from outside its workload.

  o-tp-active:
    type: outcome
    verdict: true_positive
    title: Stolen credentials used for impact
    anchor: Key {{access_key}} was used from {{ip}} to access data or make changes.
    risk: The risk here is data theft, persistence through new credentials and resource abuse; containment is required now.
    actions:
      - Revoke sessions or deactivate the key immediately
      - Remove users, keys, roles and resources created with it
      - Scope data accessed (S3, secrets, databases)
      - Fix the leak source
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor the account for activity from {{ip}} and for new credentials.
