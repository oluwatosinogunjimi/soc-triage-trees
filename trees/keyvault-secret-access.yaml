id: keyvault-secret-access
title: Key Vault or Secrets Manager Access Spike
category: cloud
summary: >-
  A user or app read many secrets, or secrets it never normally reads, from Azure Key Vault
  or AWS Secrets Manager. That is credential harvesting. Deployment pipelines read secrets
  in bursts too.
applies_to:
  - Unusual number of secret operations in Key Vault
  - Access from a suspicious IP to a key vault
  - GetSecretValue spike (Secrets Manager)
  - Key vault access policy changed
mitre: [T1555.006, T1552]
version: 1.0.0
last_reviewed: 2026-09-29
authors: [Oluwatosin Ogunjimi]
sources:
  - title: "MITRE ATT&CK T1555.006 Cloud Secrets Management Stores"
    url: https://attack.mitre.org/techniques/T1555/006/
  - title: Microsoft Defender for Key Vault alerts
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-azure-key-vault
entities:
  - { key: principal, label: "Caller (UPN, object ID or ARN)", example: "app-deploy-sp" }
  - { key: vault, label: Vault name, example: "kv-prod-core" }
start: c-reads
nodes:
  c-reads:
    type: check
    text: Measure secret reads by caller and source.
    kql:
      - title: Key Vault secret reads (48h)
        platform: sentinel
        query: |
          AzureDiagnostics
          | where TimeGenerated > ago(48h)
          | where ResourceProvider == "MICROSOFT.KEYVAULT" and Resource =~ "{{vault}}"
          | where OperationName in ("SecretGet", "SecretList", "KeyGet", "CertificateGet", "VaultPatch", "VaultPut")
          | summarize Ops = count(), Secrets = dcount(id_s), First = min(TimeGenerated) by OperationName, CallerIPAddress, identity_claim_upn_s, identity_claim_appid_g
      - title: Secrets Manager reads (48h)
        platform: sentinel
        query: |
          AWSCloudTrail
          | where TimeGenerated > ago(48h)
          | where EventName in ("GetSecretValue", "ListSecrets", "BatchGetSecretValue") and UserIdentityArn has "{{principal}}"
          | summarize Calls = count(), First = min(TimeGenerated) by EventName, SourceIpAddress, UserAgent
    note: I measured secret reads by {{principal}} from {{vault}}.
    next: q-pipeline

  q-pipeline:
    type: question
    text: Is the caller a deployment pipeline or app reading its own secrets from its usual IP?
    yes: o-fp
    no: q-policy-change
    notes:
      yes: "{{principal}} is a pipeline or app reading its own secrets from its usual source."
      no: "{{principal}} read secrets outside its normal pattern."

  q-policy-change:
    type: question
    text: Did the caller (or someone) grant itself access just before reading (access policy or RBAC change)?
    yes: o-tp
    no: q-user-reason
    notes:
      yes: Access to {{vault}} was granted just before the reads.
      no: The caller already had access to {{vault}}.

  q-user-reason:
    type: question
    text: Is it an administrator with a documented reason (rotation, audit, migration)?
    yes: o-benign
    no: o-tp
    notes:
      yes: The reads were an administrator task with a documented reason.
      no: No documented reason explains the reads.

  o-fp:
    type: outcome
    verdict: false_positive
    title: Pipeline or app reading its own secrets
    anchor: "{{principal}} read its own secrets from {{vault}} from its usual source."
    risk: The risk here is credential harvesting; it doesn't apply given the normal pattern.
    actions:
      - Close

  o-benign:
    type: outcome
    verdict: benign_positive
    title: Documented admin access
    anchor: "{{principal}} read secrets from {{vault}} for a documented administrative task."
    risk: The risk here is credential harvesting; it doesn't apply given the documented task.
    actions:
      - Close referencing the task

  o-tp:
    type: outcome
    verdict: true_positive
    title: Secret harvesting
    anchor: "{{principal}} harvested secrets from {{vault}} without a legitimate reason."
    risk: The risk here is every harvested secret giving access to databases, APIs and other clouds; each must be rotated.
    actions:
      - Revoke the caller's access and sessions
      - Rotate every secret, key and certificate that was read
      - Review use of those secrets since the read
      - Raise an incident and escalate
    escalate: true
    monitor: I will monitor {{vault}} for further reads and access changes.
